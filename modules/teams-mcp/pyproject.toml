[project]
name = "teams-mcp"
version = "0.1.0"
description = "MCP tools over the teams catalogue — composing and correcting a team by talking to it"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly, matching market-mcp's and trading-mcp's own pin for the same
    # reason: `mcp` moved `FastMCP` across a release while the first of them was
    # being written.
    "mcp==1.27.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
    # Only for this module's own outbound identity to teams. The operator's token
    # travels separately and is never fetched here.
    "azure-identity>=1.17",
]

# Not a packaged library — uv only manages the venv and deps, no build step.
[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["teams_mcp"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "contract: checks the client against the committed teams OpenAPI snapshot",
]

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff==0.16.2",
    "respx>=0.21",
]
