[project]
name = "trading-mcp"
version = "0.1.0"
description = "MCP tools over capital-gateway's demo account — reads and order writes for teams"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly, matching market-mcp's own pin for the same reason: `mcp` moved
    # `FastMCP` across a release while that module was being written.
    "mcp==1.27.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
    # The caller-identity middleware and the upstream-refusal helper, one copy each
    # (packages-replace-the-hand-copies). Everything else in this module stays here:
    # its server, its client, its settings and its error taxonomy are not copies.
    "tc-mcp-kit",
    # This module's own identity, presented to capital-gateway wherever there is a
    # directory to get a token from (the-gateway-door-authenticates).
    "azure-identity>=1.17",
]

# Not a packaged library — uv only manages the venv and deps, no build step.
[tool.uv]
package = false

[tool.uv.sources]
tc-mcp-kit = { path = "../../packages/tc-mcp-kit", editable = true }

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["trading_mcp"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "contract: checks the client against the committed capital-gateway OpenAPI snapshot",
]

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff==0.16.2",
    "respx>=0.21",
]
