[project]
name = "capital-gateway"
version = "0.1.0"
description = "capital.com gateway — trading, deep history and a live stream behind one contract"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic-settings>=2.2",
    # Exports this module's logs to Application Insights when a connection string is
    # configured, and is inert without one. Same version market-data pins.
    "azure-monitor-opentelemetry>=1.6",
]

# Not a packaged library — uv only manages the venv and deps, no build step.
[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults are idiomatic, not the B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
# The module itself. The suite is deliberately outside: its fakes are structural on
# purpose — a class with the three methods a caller actually uses — and satisfying a
# checker there would mean a Protocol per seam, bought with nothing the tests do not
# already prove by running.
include = ["capital_gateway"]
# Basic, not strict, and that is the whole point of the step. Basic reads the code as
# written and asks whether it holds together; strict would additionally demand an
# annotation on everything, which is a different project with a different payoff.
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: hits the real capital.com demo API (opt-in via --run-live, needs credentials)",
    "live_trading: opens and closes real demo positions (opt-in via --run-live-trading)",
]

[dependency-groups]
dev = [
    # Pinned exactly, unlike the rest of this list. A type checker that upgrades itself
    # decides when this repository's CI turns red, and it does so between two runs of the
    # same commit — the one kind of failure that teaches nothing. Raised deliberately.
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    # Pinned exactly, not a floor. `>=0.7` meant CI took whatever was newest, which today
    # resolves to 0.16.2 with 413 rules active — a far wider set than anything 0.7 ran by
    # default. New rules have been worth having (UP037 caught a real defect in
    # market-data's config.py), but with a floor it is the linter's publisher who decides
    # when a commit that was green turns red. Raised deliberately, and in step with the
    # other module: two modules linting at different versions is two standards.
    "ruff==0.16.2",
]
