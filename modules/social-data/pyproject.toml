[project]
name = "social-data"
version = "0.1.0"
description = "The post archive — what was said, when, and what a model made of it"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Alembic drives migrations through SQLAlchemy Core; this module's own queries go straight through asyncpg. The
    # `asyncio` extra pulls greenlet, without which an async engine raises at its first connect.
    "sqlalchemy[asyncio]>=2.0",
    # The database credential: an Entra token fetched at connection time, never a stored password. `azure.identity.aio`
    # imports aiohttp lazily and fails at first use rather than at install, so it is named explicitly.
    "azure-identity>=1.19",
    "aiohttp>=3.10",
    # The feed is a document written by somebody else. `xml.etree` expands entities, so a document with three nested
    # ones is a memory exhaustion this module would perform on itself; `defusedxml` refuses it instead.
    "defusedxml>=0.7",
    # One call per post, with a fixed response schema — not the streamed, tool-carrying conversation `tc-openai`
    # exists for. Taking that package here would pull langchain and a stream to use neither.
    "openai>=1.60",
    # Database, migrations, schema check, Easy Auth. Taken whole, like `polymarket-data`: the migrations are small
    # and the lock wait is the ordinary one.
    "tc-runtime",
    # Pinned exactly, unlike everything above it: 2.0.0 moved `FastMCP` out of `mcp.server.fastmcp`, so a floor is a
    # module that stops importing on somebody else's release day.
    "mcp==1.27.0",
    # Caller identity, upstream-refusal flattening and the schema slimmer, for the tool surface at `/mcp`.
    "tc-mcp-kit",
]

# Not a packaged library — uv only manages the venv and deps, no build step.
[tool.uv]
package = false

[tool.uv.sources]
tc-runtime = { path = "../../packages/tc-runtime", editable = true }
tc-mcp-kit = { path = "../../packages/tc-mcp-kit", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults are idiomatic, not the B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
# What runs in production: the module and the migrations the deploy applies before it.
include = ["social_data", "migrations"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a real PostgreSQL (a throwaway container, started on demand — see conftest)",
    "live: reads the real feed over the network (needs --run-live)",
]

[dependency-groups]
dev = [
    # Pinned exactly, like every other module here: a type checker that upgrades itself decides when CI turns red,
    # and it does so between two runs of the same commit.
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff==0.16.2",
    # A throwaway PostgreSQL per test session rather than a shared database: the schema is the thing under test, and
    # a leftover table is indistinguishable from a migration that works.
    "testcontainers[postgres]>=4.8",
]
