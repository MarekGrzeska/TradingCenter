# Alembic, kept to what this module actually uses.
#
# `sqlalchemy.url` is deliberately absent: the connection string is DATABASE_URL, read
# through the module's own settings in `migrations/env.py`, so there is exactly one place
# a database is named. Tests override it with `set_main_option`.

[alembic]
script_location = migrations

# So `migrations/env.py` can import `market_data` when alembic runs from this directory.
prepend_sys_path = .

# Migrations are handwritten SQL, not autogenerated, so the file name is chosen by hand
# and the revision id is a plain sequence number rather than a hash.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
