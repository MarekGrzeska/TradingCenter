[project]
name = "market-data"
version = "0.1.0"
description = "The candle archive — what the gateway showed once, kept for as long as it is useful"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic-settings>=2.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Alembic drives migrations through SQLAlchemy Core; the module's own queries go
    # straight through asyncpg, so no ORM is pulled into the runtime path. The `asyncio`
    # extra is not optional here: it pulls greenlet, without which an async engine raises
    # at its first connect — and the only driver this module installs is an async one.
    "sqlalchemy[asyncio]>=2.0",
    # The database credential: an Entra token for the module's own identity — a managed
    # identity in Azure, a service principal (client secret) locally — fetched at
    # connection time, never a stored password (design.md, "Do bazy — tożsamość").
    # `azure.identity.aio`'s async transport imports aiohttp lazily and errors at first
    # use, not at install time, if it is missing — an explicit dependency here, not a
    # transitive one left to chance.
    "azure-identity>=1.19",
    "aiohttp>=3.10",
    # The candle-age metric the most important alert stands on (design.md, group 10) —
    # auto-configures the OpenTelemetry SDK to export to Application Insights from
    # APPLICATIONINSIGHTS_CONNECTION_STRING. Unset (every local run), it is a no-op:
    # metric calls succeed against OpenTelemetry's default no-op provider instead of
    # failing, which is why telemetry.py never checks for the variable itself.
    "azure-monitor-opentelemetry>=1.6",
]

# Not a packaged library — uv only manages the venv and deps, no build step.
[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults are idiomatic, not the B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
# What runs in production: the module and the migrations the deploy applies before it.
# The suite is deliberately outside. Its fakes are structural on purpose — a class with
# the three methods a caller actually uses — and satisfying a checker there would mean a
# Protocol per seam, bought with nothing the tests do not already prove by running.
include = ["market_data", "migrations"]
# Basic, not strict, and that is the whole point of the step. Basic reads the code as
# written and asks whether it holds together; strict would additionally demand an
# annotation on everything, which is a different project with a different payoff.
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a real PostgreSQL (a throwaway container, started on demand — see conftest)",
    "live: reads through a running capital-gateway against the demo API (needs --run-live)",
]

[dependency-groups]
dev = [
    # Pinned exactly, unlike the rest of this list. A type checker that upgrades itself
    # decides when this repository's CI turns red, and it does so between two runs of the
    # same commit — the one kind of failure that teaches nothing. Raised deliberately.
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    # Pinned exactly, not a floor. `>=0.7` meant CI took whatever was newest, which today
    # resolves to 0.16.2 with 413 rules active — a far wider set than anything 0.7 ran by
    # default. New rules have been worth having (UP037 caught a real defect in config.py),
    # but with a floor it is the linter's publisher who decides when a commit that was
    # green turns red. Raised deliberately, in a commit that says which rules arrived.
    "ruff==0.16.2",
    # Brings up a throwaway PostgreSQL per test session. A container rather than a
    # shared database, because the schema is the thing under test and a leftover
    # table from a previous run is indistinguishable from a migration that works.
    "testcontainers[postgres]>=4.8",
]
