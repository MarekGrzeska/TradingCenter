[project]
name = "market-data"
version = "0.1.0"
description = "The candle archive — what the gateway showed once, kept for as long as it is useful"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic-settings>=2.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Alembic drives migrations through SQLAlchemy Core; the module's own queries go straight through asyncpg. The
    # `asyncio` extra pulls greenlet, without which an async engine raises at its first connect.
    "sqlalchemy[asyncio]>=2.0",
    # The database credential: an Entra token fetched at connection time, never a stored password. `azure.identity.aio`
    # imports aiohttp lazily and fails at first use rather than at install, so it is named rather than left to chance.
    "azure-identity>=1.19",
    "aiohttp>=3.10",
    # `market_data/indicators/kernel.py`'s only dependency, and deliberately its only one
    # — see that module's docstring for why it imports nothing else.
    "numpy>=2.0",
    # `zoneinfo` falls back to this package where the OS ships no tz database — Windows never does and slim images
    # drop it. `catalogue.py` builds its entries at import, so a missing one is a module that will not import at all.
    "tzdata>=2024.1",
    # The candle-age metric the most important alert stands on, exported from APPLICATIONINSIGHTS_CONNECTION_STRING.
    # Unset it is a no-op against OpenTelemetry's default provider, which is why telemetry.py never checks for it.
    "azure-monitor-opentelemetry>=1.6",
    # Runtime plumbing shared with the workbench. Taken partially: this module keeps its own `db.py`, which is 56.2%
    # identical to the package's rather than a copy of it (packages-replace-the-hand-copies/design.md, D4).
    "tc-runtime",
    # Pinned exactly, unlike everything above it: 2.0.0 moved `FastMCP` out of `mcp.server.fastmcp`, so a floor here
    # is a module that stops importing on somebody else's release day.
    "mcp==1.27.0",
    # Caller identity, upstream-refusal flattening and the schema slimmer, for the tool surface this module serves
    # at `/mcp`.
    "tc-mcp-kit",
]

# Not a packaged library — uv only manages the venv and deps, no build step.
[tool.uv]
package = false

[tool.uv.sources]
tc-runtime = { path = "../../packages/tc-runtime", editable = true }
tc-mcp-kit = { path = "../../packages/tc-mcp-kit", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults are idiomatic, not the B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
# What runs in production: the module and the migrations the deploy applies before it. The suite is deliberately
# outside — its fakes are structural, and satisfying a checker there would mean a Protocol per seam.
include = ["market_data", "migrations"]
# Basic, not strict: basic reads the code as written and asks whether it holds together, where strict would also
# demand an annotation on everything — a different project with a different payoff.
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a real PostgreSQL (a throwaway container, started on demand — see conftest)",
    "live: reads through a running capital-gateway against the demo API (needs --run-live)",
]

[dependency-groups]
dev = [
    # Pinned exactly, unlike the rest of this list: a checker that upgrades itself decides when CI turns red, and
    # does so between two runs of the same commit.
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    # Pinned exactly, not a floor. New rules have been worth having — UP037 caught a real defect in config.py — but
    # with a floor it is the linter's publisher who decides when a green commit reddens.
    "ruff==0.16.2",
    # An independent oracle for `test_indicators_talib_comparison.py`, dev-only: `market_data/indicators` imports
    # nothing from it (design.md, "Własne jądro na numpy, TA-Lib wyłącznie jako wyrocznia testowa").
    "ta-lib>=0.7.1",
    # A throwaway PostgreSQL per test session rather than a shared database: the schema is the thing under test, and
    # a leftover table is indistinguishable from a migration that works.
    "testcontainers[postgres]>=4.8",
]
