[project]
name = "strategy"
version = "0.1.0"
description = "The strategy platform — a catalogue of strategies, one runtime around them, one backtest for all of them"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # The archive is this module's only upstream, and it is reached over its published
    # REST contract — never by importing it (`docs/architecture.md`).
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Alembic drives migrations through SQLAlchemy Core; this module's own queries go
    # straight through asyncpg. The `asyncio` extra pulls greenlet, without which an async
    # engine raises at its first connect — and the only driver installed here is async.
    "sqlalchemy[asyncio]>=2.0",
    # The database credential in identity mode: an Entra token for this module's own
    # identity, fetched at connection time, never a stored password. `azure.identity.aio`
    # imports aiohttp lazily and fails at first use rather than at install, so aiohttp is
    # named here rather than left transitive.
    "azure-identity>=1.19",
    "aiohttp>=3.10",
    # Pool, advisory lock, migrations, schema check, Easy Auth principal.
    "tc-runtime",
    # Pinned exactly, unlike everything above it. 2.0.0 moved `FastMCP` out of
    # `mcp.server.fastmcp`, so a floor here is a module that stops importing on somebody
    # else's release day.
    "mcp==1.27.0",
    # Caller identity, upstream-refusal flattening and the schema slimmer, for the
    # read-only tool surface at `/mcp`.
    "tc-mcp-kit",
]

# Not a packaged library — uv only manages the venv and deps, no build step.
[tool.uv]
package = false

[tool.uv.sources]
tc-runtime = { path = "../../packages/tc-runtime", editable = true }
tc-mcp-kit = { path = "../../packages/tc-mcp-kit", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults are idiomatic, not the B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
include = ["strategy", "migrations"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a real PostgreSQL (a throwaway container, started on demand — see conftest)",
]

[dependency-groups]
dev = [
    # Both pinned exactly, for the reason market-data's pyproject.toml gives: a checker or
    # a linter that upgrades itself decides when this repository's CI turns red, between
    # two runs of the same commit.
    "pyright==1.1.411",
    "ruff==0.16.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # The archive is an HTTP contract, so the suite fakes it at the transport.
    "respx>=0.21",
    "testcontainers[postgres]>=4.8",
]
