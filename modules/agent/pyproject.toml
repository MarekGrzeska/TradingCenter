[project]
name = "agent"
version = "0.1.0"
description = "The operator's conversation with a model — sessions, streamed replies, usage priced at write time"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Alembic drives migrations through SQLAlchemy Core; the module's own queries go
    # straight through asyncpg, so no ORM is pulled into the runtime path — same split
    # as market-data.
    "sqlalchemy[asyncio]>=2.0",
    # The database credential and, in production, the credential this module presents to
    # Azure OpenAI: a managed identity in Azure, a service principal (client secret)
    # locally for the database — never a stored password (design.md, "Wobec Azure OpenAI:
    # tożsamość zarządzana, lokalnie klucz").
    "azure-identity>=1.19",
    "aiohttp>=3.10",
    # The conversation graph. One node today — the model call — with room left for tools
    # (design.md, Non-Goals: no tools yet, the shape is not to be filled in advance).
    "langgraph>=0.2",
    "langchain-openai>=0.2",
]

# Not a packaged library — uv only manages the venv and deps, no build step.
[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults are idiomatic, not the B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
include = ["agent", "migrations"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a real PostgreSQL (a throwaway container, started on demand — see conftest)",
    "live: calls a real Azure OpenAI deployment (needs --run-live and a configured key)",
]

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff==0.16.2",
    # FastAPI's TestClient is a thin wrapper over httpx; this module makes no HTTP calls
    # of its own at runtime, so it belongs to the dev group rather than the app's deps.
    "httpx>=0.27",
    # Brings up a throwaway PostgreSQL per test session, same reason as market-data: the
    # schema is the thing under test, and a leftover table from a previous run is
    # indistinguishable from a migration that works.
    "testcontainers[postgres]>=4.8",
]
