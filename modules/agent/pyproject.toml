[project]
name = "agent"
version = "0.1.0"
description = "The operator's conversation with a model — sessions, streamed replies, usage priced at write time"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Alembic drives migrations through SQLAlchemy Core; the module's own queries go
    # straight through asyncpg, so no ORM is pulled into the runtime path — same split
    # as market-data.
    "sqlalchemy[asyncio]>=2.0",
    # The database credential, and only that: a managed identity in Azure, a service
    # principal (client secret) locally — never a stored password. The model provider
    # does not use it, because OpenAI is not in Entra (design.md, "Wobec OpenAI: klucz,
    # i tylko klucz").
    "azure-identity>=1.19",
    "aiohttp>=3.10",
    # The conversation graph: a model node and a tool node, with a conditional edge
    # between them (connect-agent-to-market-mcp/design.md, "Pętla jako drugi węzeł
    # grafu").
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    # The MCP client half of the same SDK market-mcp serves with, and pinned exactly for
    # the same reason it pins it: `mcp` shipped a 2.0.0 that moved public names during
    # that module's first draft. Both modules move off this version together or not at
    # all — they speak to each other, and this is the one contract in the repository
    # with no committed snapshot to catch a drift.
    "mcp==1.27.0",
    # Runtime plumbing this module shares with the other modules that own a database.
    # A path dependency, not a workspace member and not a published artifact: the
    # package is resolved into *this* module's own lock and baked into its image at
    # build time, so the module still deploys, tests and rolls back on its own
    # (packages-replace-the-hand-copies/design.md, D3).
    "tc-runtime",
]

# Not a packaged library — uv only manages the venv and deps, no build step.
[tool.uv]
package = false

[tool.uv.sources]
tc-runtime = { path = "../../packages/tc-runtime", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults are idiomatic, not the B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
include = ["agent", "migrations"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a real PostgreSQL (a throwaway container, started on demand — see conftest)",
    "live: calls a real OpenAI model (needs --run-live and a configured key)",
]

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff==0.16.2",
    # FastAPI's TestClient is a thin wrapper over httpx; this module makes no HTTP calls
    # of its own at runtime, so it belongs to the dev group rather than the app's deps.
    "httpx>=0.27",
    # Brings up a throwaway PostgreSQL per test session, same reason as market-data: the
    # schema is the thing under test, and a leftover table from a previous run is
    # indistinguishable from a migration that works.
    "testcontainers[postgres]>=4.8",
]
