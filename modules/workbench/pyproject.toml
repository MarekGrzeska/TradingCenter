[project]
name = "workbench"
version = "0.1.0"
description = "The operator's conversation with a model, the teams they compose, and two archives — prediction markets and posts — one process, four schemas"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Alembic drives migrations through SQLAlchemy Core; both surfaces' own queries go straight through asyncpg, so
    # no ORM is pulled into the runtime path — the same split market-data makes.
    "sqlalchemy[asyncio]>=2.0",
    # The database credential, and only that: a managed identity in Azure, a service principal locally, never a
    # stored password. The model provider does not use it, because OpenAI is not in Entra.
    "azure-identity>=1.19",
    # azure-identity's `aio` credentials build an async pipeline that imports this at construction time, so
    # `DefaultAzureCredential()` fails without it — not just the tool session that uses it directly.
    "aiohttp>=3.10",
    # Both surfaces' graphs: the conversation's model-and-tool loop, and a team's one
    # node per agent with the operator's edges between them.
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    # The MCP client half of the SDK market-data and trading-mcp serve with, pinned exactly for the reason all of
    # them pin it: `mcp` shipped a 2.0.0 that moved public names during a minor series.
    "mcp==1.27.0",
    # `tools/client.py` builds its session's HTTP client and per-request auth flow against httpx directly, and
    # `teams_tools/client.py` speaks to the teams routers through `httpx.ASGITransport` — no network, same process.
    "httpx>=0.27",
    # Rolls a five-field cron expression forward from a point in time — the one place the
    # teams surface resolves "when does this schedule fire next".
    "croniter>=3.0",
    # The IANA database `ZoneInfo("Europe/Warsaw")` reads, named explicitly because the platform is not a reliable
    # source of it: Windows ships none, and a slim container image usually ships none either.
    "tzdata>=2024.1",
    # A path dependency, not a workspace member and not a published artifact: the package is resolved into *this*
    # module's own lock and baked into its image at build time (packages-replace-the-hand-copies/design.md, D3).
    "tc-runtime",
    # The streamed OpenAI call. Both surfaces make one, with separate keys that never
    # travel through the package.
    "tc-openai",
    # The caller-identity middleware and the upstream-refusal helper the team tools use.
    "tc-mcp-kit",
    # The post archive's two: its feed is a document written by somebody else, and `xml.etree` expands entities —
    # `defusedxml` refuses the document that would be a memory exhaustion performed on ourselves. `openai` direct,
    # not through `tc-openai`: one call per post with a fixed response schema, no stream and no tools.
    "defusedxml>=0.7",
    "openai>=1.60",
]

# Not a packaged library — uv only manages the venv and deps, no build step.
[tool.uv]
package = false

[tool.uv.sources]
tc-runtime = { path = "../../packages/tc-runtime", editable = true }
tc-openai = { path = "../../packages/tc-openai", editable = true }
tc-mcp-kit = { path = "../../packages/tc-mcp-kit", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults are idiomatic, not the B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
include = ["workbench", "agent", "teams", "teams_tools", "polymarket_data", "social_data", "migrations"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a real PostgreSQL (a throwaway container, started on demand — see conftest)",
    "live: calls a real OpenAI model (needs --run-live and a configured key)",
]

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff==0.16.2",
    # A throwaway PostgreSQL per test session, same reason as market-data: the schema is the thing under test, and a
    # leftover table is indistinguishable from a migration that works.
    "testcontainers[postgres]>=4.8",
    "respx>=0.21",
]
