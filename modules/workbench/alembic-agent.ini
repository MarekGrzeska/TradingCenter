# Alembic, kept to what this module actually uses.
#
# One of two chains: this file drives the `agent` database. The module runs both at
# startup through `tc_runtime.migrate`, which builds its Config in memory and never
# reads this file — it exists for `uv run alembic -c alembic-agent.ini ...` by hand.
#
# `sqlalchemy.url` is deliberately absent: the connection string is AGENT_DATABASE_URL,
# read through `workbench/config.py` in `migrations/*/env.py`, so there is exactly one
# place a database is named. Tests override it with `set_main_option`.

[alembic]
script_location = migrations/agent

# So `migrations/agent/env.py` can import `workbench` when alembic runs from here.
prepend_sys_path = .
path_separator = os

# Migrations are handwritten SQL, not autogenerated, so the file name is chosen by hand
# and the revision id is a plain sequence number rather than a hash.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
