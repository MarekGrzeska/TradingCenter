# One of two chains, driving the `agent` database; the module runs both at startup through `tc_runtime.migrate`, which
# never reads this file. `sqlalchemy.url` is absent: AGENT_DATABASE_URL through `workbench/config.py` names it once.

[alembic]
script_location = migrations/agent

# So `migrations/agent/env.py` can import `workbench` when alembic runs from here.
prepend_sys_path = .
path_separator = os

# Migrations are handwritten SQL, not autogenerated, so the file name is chosen by hand
# and the revision id is a plain sequence number rather than a hash.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
