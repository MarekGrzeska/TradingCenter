# Alembic, kept to what this module uses. `sqlalchemy.url` is deliberately absent: the connection string is
# STRATEGIES_DATABASE_URL, read through the process's whole settings in `migrations/env.py` (so the workbench's
# required lines must be there too), and one place names a database.

[alembic]
script_location = migrations/strategies

# So `migrations/env.py` can import `strategies` when alembic runs from this directory.
prepend_sys_path = .
path_separator = os

# Migrations are handwritten SQL, not autogenerated, so the file name is chosen by hand
# and the revision id is a plain sequence number rather than a hash.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
