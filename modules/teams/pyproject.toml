[project]
name = "teams"
version = "0.1.0"
description = "Operator-defined teams of agents, saved to a catalogue and run by hand — this phase writes no order"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Alembic drives migrations through SQLAlchemy Core; the module's own queries go
    # straight through asyncpg, so no ORM is pulled into the runtime path — same split
    # as market-data and agent.
    "sqlalchemy[asyncio]>=2.0",
    # The database credential, and only that: a managed identity in Azure, a service
    # principal (client secret) locally — never a stored password. The model provider
    # does not use it, because OpenAI is not in Entra.
    "azure-identity>=1.19",
    # azure-identity's `aio` credentials build an async HTTP pipeline that imports this
    # at construction time — `DefaultAzureCredential()` fails without it, not just the
    # tool-server session that uses it directly.
    "aiohttp>=3.10",
    # The MCP client half of the same SDK market-mcp serves with, and pinned exactly for
    # the same reason `agent` pins it: `mcp` shipped a 2.0.0 that moved public names
    # during a minor series, and this module imports two of them (`ClientSession`,
    # `streamable_http_client`) plus one private helper.
    "mcp==1.27.0",
    # `tools/client.py` builds the session's HTTP client and its per-request auth flow
    # against httpx directly. It arrives with `mcp` anyway; named here because this
    # module's own code imports it, which is what a dependency list is for.
    "httpx>=0.27",
    # The team's own graph: one node per agent, the operator's edges between them, and
    # concurrent supersteps for agents whose dependencies are already met. Chosen because
    # its model maps one to one onto what a revision stores, and because the repository
    # already runs it in `agent` (design.md, "LangGraph, nie OpenAI Agents SDK").
    "langgraph>=0.2",
    # The provider, and the one place its message classes exist (`provider.py`).
    "langchain-openai>=0.2",
    # Rolls a five-field cron expression forward from a point in time — the one place
    # this module resolves "when does this schedule fire next", used at save time to
    # seed `next_fire_at` and by the clock itself to advance it after a claim
    # (design.md, "Wyrażenie cron w UTC, rozwijane przez croniter").
    "croniter>=3.0",
    # The IANA database `ZoneInfo("Europe/Warsaw")` reads. Named explicitly because the
    # platform is not a reliable source of it: Windows ships none at all, and a slim
    # container image usually ships none either — a schedule that cannot be expressed in
    # the operator's own clock is this module refusing to start (`scheduler/timing.py`).
    "tzdata>=2024.1",
]

# Not a packaged library — uv only manages the venv and deps, no build step.
[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults are idiomatic, not the B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
include = ["teams", "migrations"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a real PostgreSQL (a throwaway container, started on demand — see conftest)",
]

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff==0.16.2",
    # Brings up a throwaway PostgreSQL per test session, same reason as agent and
    # market-data: the schema is the thing under test.
    "testcontainers[postgres]>=4.8",
]
