[project]
name = "polymarket-data"
version = "0.1.0"
description = "The prediction-market archive — what a market thought a thing was worth, kept after the market forgets"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Alembic drives migrations through SQLAlchemy Core; this module's own queries go
    # straight through asyncpg, so no ORM is pulled into the runtime path. The `asyncio`
    # extra is not optional: it pulls greenlet, without which an async engine raises at
    # its first connect — and the only driver installed here is an async one.
    "sqlalchemy[asyncio]>=2.0",
    # The database credential: an Entra token for the module's own identity, fetched at
    # connection time, never a stored password. `azure.identity.aio`'s async transport
    # imports aiohttp lazily and errors at first use, not at install time, if it is
    # missing — named explicitly here rather than left to chance.
    "azure-identity>=1.19",
    "aiohttp>=3.10",
    # `zoneinfo` reads the operating system's tz database and falls back to this package
    # when there is none. `python:3.12-slim-bookworm` (the Dockerfile's runtime stage)
    # ships none, and Windows never has.
    "tzdata>=2024.1",
    # Database, migrations, schema check, Easy Auth. Taken whole: unlike `market-data`,
    # this module has no reason of its own to keep a `db.py` — its migrations are small
    # and its lock wait is the ordinary one.
    "tc-runtime",
    # Pinned exactly, unlike everything above it. 2.0.0 moved `FastMCP` out of
    # `mcp.server.fastmcp`, so a floor here is a module that stops importing on somebody
    # else's release day. Same pin as `market-data` on purpose.
    "mcp==1.27.0",
    # Caller identity, upstream-refusal flattening and the schema slimmer, for the tool
    # surface this module serves at `/mcp`.
    "tc-mcp-kit",
]

# Not a packaged library — uv only manages the venv and deps, no build step.
[tool.uv]
package = false

[tool.uv.sources]
tc-runtime = { path = "../../packages/tc-runtime", editable = true }
tc-mcp-kit = { path = "../../packages/tc-mcp-kit", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults are idiomatic, not the B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
# What runs in production: the module and the migrations the deploy applies before it.
include = ["polymarket_data", "migrations"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a real PostgreSQL (a throwaway container, started on demand — see conftest)",
    "live: reads the real Polymarket API over the network (needs --run-live)",
]

[dependency-groups]
dev = [
    # Pinned exactly, like every other module here: a type checker that upgrades itself
    # decides when CI turns red, and it does so between two runs of the same commit.
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff==0.16.2",
    # Brings up a throwaway PostgreSQL per test session. A container rather than a shared
    # database, because the schema is the thing under test and a leftover table from a
    # previous run is indistinguishable from a migration that works.
    "testcontainers[postgres]>=4.8",
]
