[project]
name = "market-mcp"
version = "0.1.0"
description = "Read-only MCP tools over market-data's archive — reduced for a model, not proxied for a chart"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly, not a floor. `mcp` released 2.0.0 while this module was being
    # written and moved `FastMCP` out of `mcp.server.fastmcp` in the process — the same
    # kind of break `pyright` is pinned against below, from an SDK that moves faster.
    "mcp==1.27.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
    # The credential this module presents to market-data in Azure: a managed identity,
    # never a stored key (design.md, "Kontrakt sprawdzany snapshotem, nie generowanym
    # klientem" / specs/market-mcp-upstream-access).
    "azure-identity>=1.19",
    # `azure.identity.aio` builds its own async transport and imports `aiohttp` to do it —
    # `ImportError: aiohttp package is not installed`, raised from inside the credential's
    # constructor rather than at import time. It is not an extra of `azure-identity`, so
    # nothing pulls it in; `agent` lists it next to the same dependency for the same
    # reason. Missing here it costs nothing locally and everything deployed: the
    # credential is only constructed when `MARKET_DATA_SCOPE` is set, which is true of
    # the Azure instance and of nothing else, so every test and every local run took the
    # branch that never touches it. Found by a container that would not start, 13 August
    # 2026.
    "aiohttp>=3.10",
]

# Not a packaged library — uv only manages the venv and deps, no build step.
[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["market_mcp"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "contract: checks the client against the committed market-data OpenAPI snapshot",
    "live: calls a real running market-data instance (needs --run-live)",
]

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff==0.16.2",
    "respx>=0.21",
]
