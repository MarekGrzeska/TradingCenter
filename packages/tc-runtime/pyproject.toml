[project]
name = "tc-runtime"
version = "0.1.0"
description = "Runtime plumbing measured as a hand-maintained copy across modules — database, migrations, schema check, Easy Auth"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Alembic drives migrations through SQLAlchemy Core; a consuming module's own
    # queries go straight through asyncpg, so no ORM reaches the runtime path.
    "sqlalchemy[asyncio]>=2.0",
    # The database credential, and only that: a managed identity in Azure, a service
    # principal locally — never a stored password.
    "azure-identity>=1.19",
    # Not optional, and the reason is an incident: `azure.identity.aio` raises `ImportError` from the credential's
    # *constructor* with no async transport installed, which market-mcp found as a container that would not start.
    # The trap springs only where a credential is constructed, so the package carries it and no consumer remembers.
    "aiohttp>=3.10",
    # `auth` and `routers` are FastAPI-shaped. A module that only wants `db` still installs it; splitting the package
    # would be two packages for a dependency every consumer already has.
    "fastapi>=0.110",
    # `liveness` creates an observable gauge and `telemetry` exports it. One dependency rather than
    # two: the Azure distribution brings the OpenTelemetry API it is configured through.
    "azure-monitor-opentelemetry>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tc_runtime"]

# Tool versions pinned to the same values every module pins, so a rule that passes here passes there: a package
# linted by a different ruff than its consumers reports green and reddens somebody else's job.
[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults are idiomatic, not the B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
include = ["tc_runtime"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a real PostgreSQL (a throwaway container, started on demand)",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff==0.16.2",
]
