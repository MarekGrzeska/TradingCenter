[project]
name = "tc-openai"
version = "0.1.0"
description = "The streamed OpenAI call with tools, shared by the two modules that make one"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tc_openai"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["tc_openai"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff==0.16.2",
]
