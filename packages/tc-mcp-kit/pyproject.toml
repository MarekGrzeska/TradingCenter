[project]
name = "tc-mcp-kit"
version = "0.1.0"
description = "Caller identity in both directions, the upstream-refusal helper and the tool-schema slimmer — the shared plumbing that needs no database"
requires-python = ">=3.12"
dependencies = [
    # `network_identity` is raw ASGI and needs Starlette's own types; `detail` reads an upstream's refusal off an
    # `httpx` response. No database driver and no FastAPI, which is the split that made this package.
    "httpx>=0.27",
    "starlette>=0.37",
    # `tool_schemas` reaches into a built server's tool registry, which is FastMCP's. Not a widening: all three
    # consumers are MCP servers by definition, and all three already pin `mcp==1.27.0` themselves.
    "mcp>=1.27,<2",
    # `outbound_identity` asks a managed identity for a token. Not a widening either: every module
    # that takes this package already declares `azure-identity` itself, because every one of them
    # presents a token somewhere — measured before adding it, not assumed.
    "azure-identity>=1.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tc_mcp_kit"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["tc_mcp_kit"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    # The published schema has to still allow what it allowed — `jsonschema` is what
    # says so, and it is what the lowlevel MCP server validates replies with.
    "jsonschema>=4.23",
    "pyright==1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff==0.16.2",
]
