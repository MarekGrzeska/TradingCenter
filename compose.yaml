# The database, and only the database: services run on the host, where `uv run` and `vite` reload on save and read
# the `.env` beside them, while PostgreSQL is the one dependency that is a chore to install per machine.
#
#     docker compose up -d db          # or ./scripts/dev.sh, which does it for you
#     docker compose down -v           # stop, and forget everything collected
#
# The credentials match `modules/market-data/.env.example` exactly, so a fresh checkout needs no further edit.

name: tradingcenter

services:
  db:
    image: postgres:17-alpine
    container_name: tradingcenter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: market_data
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: market_data
      # The archive keys everything on instants and stores them as timestamptz. A container on local time would
      # store the right moment and print every candle shifted, which is a confusing hour to spend.
      TZ: UTC
      PGTZ: UTC
    ports:
      # 55432 on the host, deliberately nowhere near 5432: a developer machine often already runs PostgreSQL of its
      # own — Postgres.app runs one per major version on consecutive ports — and colliding succeeds at worst, with
      # the archive migrating and filling a database belonging to something else. 127.0.0.1, or this is a database
      # with a published password offered to the café wifi.
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone answers before first-boot initialisation finishes, so the dev scripts would race it.
      # Naming the user and database makes it answer only once the thing to be connected to is there.
      test: ["CMD-SHELL", "pg_isready -U market_data -d market_data -q"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  db-data:
    # Named, so `docker compose down` keeps the archive and only `down -v` throws it away. Re-collecting three years
    # of minute candles for a hundred instruments costs about twenty-seven hours of provider calls.
    name: tradingcenter-db-data
