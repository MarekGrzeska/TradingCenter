schema: spec-driven-reviewed

context: |
  Language: OpenSpec artifacts in this project are written in POLISH prose.
  Everything else — code, comments, identifiers, commit messages, module READMEs —
  stays English.

  Structure stays English, because the CLI parses it. Never translate:
    - section headers from the artifact template: ## Why, ## What Changes,
      ## Capabilities, ### New Capabilities, ### Modified Capabilities, ## Impact,
      ## Purpose, ## Context, ## Goals / Non-Goals, ## Decisions,
      ## Risks / Trade-offs, ## Migration Plan, ## Open Questions
    - delta operations: ## ADDED / MODIFIED / REMOVED / RENAMED Requirements
    - ### Requirement: and #### Scenario: prefixes (the name after the colon is Polish)
    - the scenario keywords **WHEN** / **THEN** / **AND**
    - task checkboxes: - [ ] X.Y
    - **Reason** / **Migration** labels in REMOVED requirements

  RFC 2119 keywords stay English inside Polish sentences — MUST, MUST NOT, SHALL,
  SHOULD, MAY — the way "working order" or "forming candle" stays English. They are
  terms of art, and `openspec validate --strict` fails a requirement whose text
  carries no literal SHALL or MUST. Polish "MUSI" does not satisfy it.
  Example: "Moduł MUST odmówić pracy z hostem innym niż demo."

  Validate with: openspec validate <change> --strict

  Naming: the operator-facing frontend is the **terminal** (modules/terminal),
  never a "console" or "dashboard".

  Tech stack: Python 3.12 (uv, ruff, pytest) for services; React + TypeScript
  (Vite, pnpm) for frontends. Monorepo: modules/ + openspec/ + docs/. Every module
  runs standalone and communicates only through a published contract (HTTP/OpenAPI,
  CLI, or typed events) — no cross-module imports.

  NOT EVERY CHANGE IS AN OPENSPEC CHANGE. Open one when the work will change any
  of these three, and otherwise do not:
    1. a requirement — anything under openspec/specs/
    2. a contract between modules — market_data/contract.py, capital_gateway/dtos.py,
       or the terminal's generated contract
    3. infrastructure — infra/**

  Everything else is a branch, its tests, and a pull request: bug fixes, refactors
  that keep behaviour, UI work that adds no requirement, documentation, CI, tooling.
  Those are not lesser changes and they are not exempt from review — they are simply
  not spec work, and wrapping them in five artifacts buys nothing.

  The test is mechanical on purpose: name the files the work will touch, and if none
  of them is in the three categories above, there is nothing for a spec to say. If
  one is, the full path applies and the change is worth its paperwork.

  Why this rule exists, in numbers measured on 10 August 2026: openspec/ held 13,699
  lines, of which 3,292 were specs — the truth every change reads — and 10,239 were
  the archived paperwork of 13 changes, roughly 790 lines per change. Over the single
  change merged the evening this was measured, OpenSpec prose grew 445 lines against
  197 lines of production code. The ritual, not the architecture, is what slows the
  work down; see docs/dlaczego-robi-sie-wolniej.html.

# Per-artifact rules
#
# Budgets, not style. Each of these exists because the artifact it names had grown
# into a place where the same thing gets said a second time.
rules:
  proposal:
    - One page. Why, what changes, which capabilities, impact — nothing else.
    - Do not restate a requirement the delta spec is about to state properly.
  design:
    - Write it only when there is a real decision with alternatives that were
      genuinely considered. A design.md that narrates the implementation is the
      implementation written twice.
    - When there is no such decision, say so in one line and move on. An empty
      Decisions section is a better artifact than an invented one.
  tasks:
    - The work, not the reasoning. If a task needs a paragraph to justify it, that
      paragraph belongs in design.md and the task belongs in one line.
  review:
    - 'A finding-free review is a legitimate result: do not pad the table.'
    - Name the test that proves each scenario, file::test_name. A scenario with no
      test is a gap and is listed as one.

# Per-operation guidance
#
# What an archived change keeps, and what it stops keeping. Decided by the operator on
# 10 August 2026 after the archive of thirteen changes had reached 10,239 lines and was
# growing by roughly 790 a change.
operations:
  archive:
    guidance:
      - After the change directory has been moved into openspec/changes/archive/, run
        scripts/trim-openspec-archive.sh from the repository root. It removes the delta
        specs and the ticked tasks.md from every archived change, and keeps proposal.md,
        design.md, review.md and .openspec.yaml.
      - The reason, so the step is not cargo-cult. This very archive merged the delta into
        openspec/specs/, which makes the copy left behind a frozen version of the truth,
        and a checklist with every box ticked says less about what was done than the
        commits do - with their diffs attached. What stays is what git cannot hand back in
        readable form - why the change was opened, what was weighed, how it was judged.
      - Run it after the move and never instead of it, and never before the spec sync has
        been verified - the delta specs are what that sync reads.
