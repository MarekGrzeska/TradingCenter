<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Karla:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap">
<style>
  :root {
    --paper: #fcfbf7;
    --card: #ffffff;
    --band: #14306b;
    --band-2: #1d4291;
    --line: #ddd9cd;
    --line-soft: #ebe8de;
    --ink: #16181d;
    --ink-2: #4f535e;
    --ink-3: #85899a;
    --navy: #14306b;
    --navy-soft: #e6ebf5;
    --yellow: #f2c313;
    --yellow-soft: #fdf3d0;
    --green: #17734c;
    --green-soft: #e0f0e8;
    --red: #b8322a;
    --red-soft: #fae7e4;
    --head: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "Karla", system-ui, sans-serif;
    --mono: "Roboto Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink-2);
    font-family: var(--body); font-size: 16.5px; line-height: 1.64;
    -webkit-font-smoothing: antialiased;
  }
  .inner { max-width: 1080px; margin: 0 auto; padding: 0 30px; }
  @media (max-width: 620px) { .inner { padding: 0 18px; } }

  header.hero { background: var(--band); color: #ffffff; padding: 52px 0 46px; }
  header.hero .kicker {
    display: inline-block; font-family: var(--mono); font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--band);
    background: var(--yellow); padding: 5px 11px; margin-bottom: 22px;
  }
  header.hero h1 {
    font-family: var(--head); font-weight: 800; font-size: clamp(38px, 6.6vw, 76px);
    line-height: 0.98; letter-spacing: -0.035em; color: #ffffff; margin: 0 0 18px;
    max-width: 17ch; text-wrap: balance;
  }
  header.hero .lede { font-size: 20px; line-height: 1.48; color: #d6dcec; margin: 0; max-width: 56ch; }
  header.hero .lede b { color: #ffffff; font-weight: 700; }
  header.hero .strip {
    display: flex; flex-wrap: wrap; gap: 8px 30px; margin-top: 28px; padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.22);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.07em; color: #a9b5d2;
  }
  header.hero .strip b { color: var(--yellow); font-weight: 700; }

  main { padding-bottom: 96px; }

  .rail {
    background: var(--card); border: 1px solid var(--line); margin: -30px 0 0;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    position: relative; box-shadow: 0 10px 30px -18px rgba(20, 48, 107, 0.4);
  }
  .rail .cell { padding: 18px 20px; border-right: 1px solid var(--line-soft); }
  .rail .cell:last-child { border-right: none; }
  .rail .v {
    font-family: var(--head); font-weight: 800; font-size: 40px; line-height: 0.92;
    letter-spacing: -0.04em; color: var(--navy); font-variant-numeric: tabular-nums;
  }
  .rail .l { font-size: 13px; color: var(--ink-3); line-height: 1.4; margin-top: 9px; }

  section { padding-top: 60px; }
  .eyebrow {
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--navy); margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .eyebrow::after { content: ""; flex: 1; height: 3px; background: var(--yellow); }
  h2 {
    font-family: var(--head); font-weight: 700; font-size: clamp(26px, 3.6vw, 38px);
    line-height: 1.06; letter-spacing: -0.028em; color: var(--ink); margin: 0 0 18px;
    max-width: 20ch; text-wrap: balance;
  }
  p { margin: 0 0 16px; max-width: 68ch; }
  p.intro { font-size: 18.5px; line-height: 1.55; color: var(--ink); max-width: 60ch; }
  strong { color: var(--ink); font-weight: 700; }
  .hl { background-image: linear-gradient(transparent 58%, var(--yellow-soft) 58%); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  a { color: var(--navy); }
  a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  code { font-family: var(--mono); font-size: 0.83em; color: var(--navy); background: var(--navy-soft); padding: 1.5px 5px; }

  figure { margin: 26px 0 0; background: var(--card); border: 1px solid var(--line); padding: 18px 18px 12px; }
  .scroll { overflow-x: auto; }
  figure svg { display: block; width: 100%; height: auto; color: var(--ink-2); }
  figcaption {
    font-size: 13.5px; color: var(--ink-3); margin-top: 12px; padding-top: 10px;
    border-top: 3px solid var(--yellow); max-width: 74ch;
  }
  figcaption b { font-family: var(--mono); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--navy); }

  .table-wrap { background: var(--card); border: 1px solid var(--line); overflow-x: auto; margin: 4px 0 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; min-width: 630px; }
  th {
    text-align: left; font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase; color: #ffffff; background: var(--navy);
    padding: 10px 16px;
  }
  td { padding: 11px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  td b { color: var(--ink); font-weight: 700; }
  td.n, th.n { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  tr.void td { color: var(--ink-3); background: var(--red-soft); }

  pre {
    background: var(--navy); color: #e7ecf8; padding: 20px 22px; overflow-x: auto; margin: 4px 0 20px;
    font-family: var(--mono); font-size: 13px; line-height: 1.68;
  }
  pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
  .k { color: var(--yellow); font-weight: 700; }
  .s { color: #8fd6b0; }
  .c { color: #8f9ec4; }

  .tag {
    display: inline-block; font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; white-space: nowrap;
  }
  .tag.ok { background: var(--green-soft); color: var(--green); }
  .tag.att { background: var(--yellow-soft); color: #8a6708; }
  .tag.stop { background: var(--red-soft); color: var(--red); }

  .quote {
    background: var(--yellow); color: var(--ink); padding: 26px 28px; margin: 30px 0;
    font-family: var(--head); font-weight: 700; font-size: clamp(21px, 2.8vw, 29px);
    line-height: 1.16; letter-spacing: -0.02em; max-width: 30ch;
  }

  .fails { display: grid; gap: 12px; margin-top: 6px; }
  .fail {
    background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--yellow);
    padding: 15px 18px;
  }
  .fail.stop { border-left-color: var(--red); }
  .fail.ok { border-left-color: var(--green); }
  .fail h3 {
    font-family: var(--head); font-weight: 700; font-size: 19px; letter-spacing: -0.018em;
    color: var(--ink); margin: 0 0 5px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .fail p { margin: 0; font-size: 15px; max-width: 72ch; }

  footer {
    background: var(--band); color: #a9b5d2; margin-top: 70px; padding: 22px 0;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.07em;
  }
  footer .inner { display: flex; flex-wrap: wrap; gap: 8px 26px; justify-content: space-between; }

    <section>
      <div class="eyebrow">03 · Kontekst</div>
      <h2>Co się wtedy działo</h2>
      <p>Przyczyny opisane z wiedzy ogólnej, nie z archiwów systemu. Wyjątkiem jest dzień #10 — kształt dnia odczytany ze świec godzinowych, przyczyny brak.</p>
      <div class="fails"><div class="fail stop"><h3><span class="tag stop">#1 · −10,98%</span>COVID — „czarny czwartek”</h3><p><strong>12 mar 2020.</strong> Wieczorem 11 marca zakaz lotów z Europy do USA, WHO ogłasza pandemię. Na otwarciu sesji kasowej wyłącznik obrotu (circuit breaker). Najgorszy dzień w całej historii archiwum — a dzień później +9,97%.</p></div><div class="fail stop"><h3><span class="tag stop">#2 · −8,59%</span>COVID — Fed tnie do zera</h3><p><strong>16 mar 2020.</strong> W niedzielę 15 marca awaryjna obniżka stóp do 0–0,25% i QE. Rynek czyta to jako panikę: luka −8,16% na otwarciu poniedziałku, drugi wyłącznik w tygodniu. Prawie cały ruch to luka — w ciągu dnia świeca niemal płaska (−0,47%).</p></div><div class="fail att"><h3><span class="tag stop">#3 · −6,61%</span>Wyprzedaż technologii po letnim rajdzie</h3><p><strong>3 wrz 2020.</strong> Po sierpniowej hossie na Apple i Tesli (masowo kupowane opcje call, później przypisywane SoftBankowi) rynek pęka bez jednego newsu. Jeden z dwóch spadków z dziesiątki tuż przy szczycie — 6,9% od maksimum 52 tygodni.</p></div><div class="fail stop"><h3><span class="tag stop">#4 · −6,22%</span>Cła — odwet Chin</h3><p><strong>4 kwi 2025.</strong> Dwa dni po „Liberation Day” Chiny odpowiadają cłem 34% na wszystko z USA, Powell mówi o ryzyku wyższej inflacji i niższego wzrostu. W niedzielę wieczorem kolejna luka w dół.</p></div><div class="fail att"><h3><span class="tag stop">#5 · −6,01%</span>Wojna handlowa — juan powyżej 7</h3><p><strong>5 sie 2019.</strong> Chiny pozwalają juanowi spaść poniżej 7 za dolara, rynek wycenia eskalację. Uwaga na skalę: w świecy CFD jest też dalszy zjazd po zamknięciu sesji kasowej (20:00–24:00 UTC), więc spadek jest głębszy niż w indeksie kasowym NDX.</p></div><div class="fail att"><h3><span class="tag stop">#6 · −5,88%</span>Inflacja zjada marże — Target</h3><p><strong>18 maj 2022.</strong> Target po Walmarcie: wyniki pokazują, że koszty zjadają marże detalistów. Rynek w środku bessy 2022 (−29,5% od szczytu) dostaje kolejny dowód na stagflację.</p></div><div class="fail stop"><h3><span class="tag stop">#7 · −5,50%</span>CPI za sierpień wyższe niż oczekiwano</h3><p><strong>13 wrz 2022.</strong> Inflacja bazowa +0,6% m/m wobec 0,3% oczekiwanych — koniec nadziei na „pivot” Fed. Jedyny przypadek z dziesiątki, w którym 20 sesji później indeks był o ponad 10% niżej.</p></div><div class="fail att"><h3><span class="tag stop">#8 · −4,94%</span>Dzień po rajdzie 90-dniowej pauzy</h3><p><strong>10 kwi 2025.</strong> 9 kwietnia Trump zawiesza cła na 90 dni, US100 +13,7% w jeden dzień. Następnego dnia Biały Dom precyzuje, że cło na Chiny to łącznie 145% — rynek oddaje około jednej trzeciej rajdu, w dołku −7,24%.</p></div><div class="fail stop"><h3><span class="tag stop">#9 · −4,73%</span>COVID — wirus poza Chinami</h3><p><strong>27 lut 2020.</strong> Najgorszy tydzień od 2008: przypadki we Włoszech i Korei, pierwsze lokalne zakażenie w USA. Początek, nie koniec — w ciągu 20 sesji indeks zszedł jeszcze 20,6% poniżej tego zamknięcia.</p></div><div class="fail att"><h3><span class="tag stop">#10 · −4,70%</span>Pierwszy piątek czerwca — dzień NFP</h3><p><strong>5 cze 2026.</strong> Do 12:00 UTC rynek płaski, spadek zaczyna się z danymi z rynku pracy (12:30 UTC) i trwa nieprzerwanie do zamknięcia. Przyczyny nie znam, a archiwum social z tego dnia jest puste.</p></div></div>
    </section>

    <section>
      <div class="eyebrow">04 · Wnioski</div>
      <h2>Wielkie spadki przychodzą stadami</h2>
      <p><span class="hl">Osiem z dziesięciu dni wypadło w trwającej przecenie</span> — zamknięcie od 10% do 29,5% pod szczytem 52 tygodni. Wyjątki to 3 września 2020 (−6,9% od szczytu) i 5 czerwca 2026 (−6,4%): spadki z wysokiego poziomu, bez wcześniejszej bessy.</p>
      <p><strong>Następna sesja</strong> była dodatnia w dziewięciu przypadkach, średnio +2,31% — ale ta średnia stoi na jednym dniu: +9,97% po 12 marca 2020. Bez niego zostaje około +1,5%. <strong>Po 20 sesjach</strong> sześć z dziesięciu jest wyżej, mediana +4,2%, rozrzut od −10,4% do +21,3%.</p>
      <p>Najgorsze zakończenia mają spadki z <strong>początku</strong> przeceny: 27 lutego 2020 (dołek 20,6% niżej w ciągu 20 sesji) i 13 września 2022 (−11,2%). Najlepsze — te z jej <strong>dna lub blisko</strong>: marzec 2020 i kwiecień 2025. Sama wielkość spadku tego nie rozróżnia; potrzeba innej informacji niż świeca.</p>
      <div class="quote">Duży spadek mówi, że zmienność jest wysoka. Nie mówi, w którą stronę pójdzie dalej.</div>
    </section>

    <section>
      <div class="eyebrow">05 · Metoda</div>
      <h2>Czym ta świeca jest, a czym nie</h2>
      <div class="fails">
        <div class="fail"><h3>Dzień to doba UTC, nie sesja kasowa</h3><p>Świeca D1 z capital.com obejmuje 00:00–24:00 UTC, a CFD handluje się prawie całą dobę. Ruch po zamknięciu Nowego Jorku trafia do tej samej świecy, nie do następnej — dlatego ranking różni się od rankingu indeksu kasowego NDX. Przykład: „Liberation Day” (2 kwietnia 2025, ogłoszenie o 20:00 UTC) rozłożył się na świece 2 kwietnia (−3,93%) i 3 kwietnia (−1,11%), i żadna nie weszła do dziesiątki.</p></div>
        <div class="fail"><h3>Niedziela pominięta</h3><p>Archiwum trzyma krótką niedzielną świecę (otwarcie wieczorem UTC). Liczę od piątkowego zamknięcia do poniedziałkowego, więc niedzielny ruch jest w poniedziałku — stąd luka 16 marca 2020.</p></div>
        <div class="fail"><h3>Cena bid, CFD</h3><p>Poziomy to cena bid instrumentu US100 u dostawcy, nie wartość indeksu. Procenty są porównywalne, poziomy — nie dokładnie.</p></div>
        <div class="fail ok"><h3>Bez dziur</h3><p>3339 świec D1 z tabeli <code>candles</code>, 2810 sesji po odjęciu niedziel i pierwszego dnia; żadnej przerwy dłuższej niż cztery dni.</p></div>
