name: deploy-app-service

# The one deployment path for all seven App Service modules: seven copies differed by a handful of
# substitutions, and the 16 August lesson reached two of them. What stays with the callers is what differs —
# the trigger, the path filter, the probe's four parameters, and the incident comments, which have no home here.
on:
  workflow_call:
    inputs:
      module:
        description: The directory under modules/. Also the image suffix and the buildx cache scope — those three have never differed.
        required: true
        type: string
      paths:
        description: >-
          What this image bakes in, as git pathspecs one per line. A workflow started by
          `workflow_run` has no path filter, so `deploy_gate.py` asks the question instead:
          did any of these change since the last green checks run on the branch?
        required: true
        type: string
      app_name:
        description: The App Service name. Not derivable — capital-gateway's app is `app-tradingcenter-gateway`.
        required: true
        type: string
      build_context:
        description: >-
          The repository root for every module taking a package as a path dependency, since
          uv resolves it while installing the lock (packages-replace-the-hand-copies).
          capital-gateway takes none, and its Dockerfile copies `pyproject.toml` from the
          context root, so its context is still its own directory.
        required: false
        default: "."
        type: string
      probe_path:
        description: >-
          Empty for capital-gateway, and not because nothing was chosen: it admits only
          market-data's and trading-mcp's addresses, so a runner cannot reach it at all and
          the control plane is the only question its deploy can ask.
        required: false
        default: ""
        type: string
      expected_status:
        description: 200 for a health endpoint; 404 for market-data, whose only excluded path is a WebSocket route.
        required: false
        default: 200
        type: number
      body_contains:
        description: A key the module's own handler returns, so a 200 from anything in front of the container cannot pass.
        required: false
        default: ""
        type: string
      attempts:
        description: 15 s apart. Longer for agent and teams, whose lifespan blocks on their migrations before they serve.
        required: false
        default: 12
        type: number
      failure_hint:
        description: What the operator should look at first when this module fails to come up.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read # deploy_gate.py lists the checks runs
  id-token: write # azure/login's OIDC exchange
  packages: write # docker push to GHCR

jobs:
  # Whether there is anything to deploy, and which commit. Under `workflow_run` the checked commit is
  # `workflow_run.head_sha`, and `github.sha` is whatever `main` points at by now — the same thing until two
  # pushes land close together, when it is a commit nobody has checked yet.
  gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The gate diffs against a commit that may be several merges back.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - id: gate
        working-directory: scripts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PATHS: ${{ inputs.paths }}
        run: uv run python deploy_gate.py --event "$EVENT" --sha "$SHA" --paths "$PATHS"

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Not only an approval gate: the federated credential in `github-oidc.tf` has `:environment:production`
    # in its subject, so a job without this cannot authenticate to Azure at all.
    environment: production
    # One deploy of a given module at a time, and never cancelled mid-flight — a cancelled
    # `webapps-deploy` leaves the site pointing at an image whose push may not have finished.
    concurrency:
      group: deploy-${{ inputs.module }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      # Lowercased because a Docker reference cannot carry the capitals in
      # `github.repository`.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${MODULE}" >> "$GITHUB_OUTPUT"
        env:
          MODULE: ${{ inputs.module }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Otherwise buildx starts cold on every run.
      - uses: docker/setup-buildx-action@v3

      # Tagged with the commit, never `latest`: the probe below asserts that this exact
      # reference is the one App Service is serving, which `latest` makes unanswerable.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          # Relative to the workspace, not to the context — the same path for all seven.
          file: modules/${{ inputs.module }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.gate.outputs.sha }}
          cache-from: type=gha,scope=${{ inputs.module }}
          cache-to: type=gha,scope=${{ inputs.module }},mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.app_name }}
          images: ${{ steps.image.outputs.name }}:${{ needs.gate.outputs.sha }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Every input arrives through `env`, not through `${{ }}` inside the shell line, and that is
      # load-bearing: `body_contains` is `"status"` with quotes, which interpolation would collapse.
      - name: Confirm this commit's image is the one serving
        working-directory: scripts
        env:
          APP_NAME: ${{ inputs.app_name }}
          EXPECTED_IMAGE: ${{ steps.image.outputs.name }}:${{ needs.gate.outputs.sha }}
          PROBE_PATH: ${{ inputs.probe_path }}
          EXPECTED_STATUS: ${{ inputs.expected_status }}
          BODY_CONTAINS: ${{ inputs.body_contains }}
          ATTEMPTS: ${{ inputs.attempts }}
          FAILURE_HINT: ${{ inputs.failure_hint }}
        run: |
          uv run python deploy_probe.py \
            --app-name "$APP_NAME" \
            --expected-image "$EXPECTED_IMAGE" \
            --probe-path "$PROBE_PATH" \
            --expected-status "$EXPECTED_STATUS" \
            --body-contains "$BODY_CONTAINS" \
            --attempts "$ATTEMPTS" \
            --failure-hint "$FAILURE_HINT"
