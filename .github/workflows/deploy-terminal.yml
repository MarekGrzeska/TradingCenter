name: deploy-terminal

# The push to `main` no longer deploys by itself: since P5 (2 September 2026) the real site waits for a green
# `checks` run of the same commit, and `workflow_dispatch` is the operator's door around that. Pull requests
# keep their preview environments, which is the one thing here that still runs before the checks.
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    # `closed` is not decoration: a merged PR's preview environment outlives it
    # otherwise, and the Free SKU allows three. See the `close_preview` job.
    types: [opened, synchronize, reopened, closed]
    paths:
      - "modules/terminal/**"
      - ".github/workflows/deploy-terminal.yml"
  workflow_dispatch: {}

# Static Web Apps' GitHub deployment path has no OIDC option as of this writing — the action takes a deployment
# token only. That token is a real, narrow exception to design.md's "no stored Azure secret". Flagged, not hidden.
permissions:
  contents: read
  actions: read # deploy_gate.py lists the checks runs
  pull-requests: write # Azure/static-web-apps-deploy comments preview URLs on PRs

concurrency:
  # Keyed by event, not by `github.ref` alone: merging a PR fires two runs in the same second, and under a
  # ref-only key `cancel-in-progress` killed the production deploy of 8f0786a one second in.
  group: deploy-terminal-${{ github.event_name }}-${{ github.event.number || github.ref }}
  # A superseded PR build is worth cancelling; a deploy to the real site is not. Same rule as the App Service
  # workflows state as "never cancel a deploy mid-flight" — this one has two kinds of run to tell apart.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether there is anything to deploy, and which commit — the same question the App Service workflows ask in
  # `_deploy-app-service.yml`, and for the same reason: under `workflow_run` there is no path filter and
  # `github.sha` may be a commit nobody has checked yet. A pull request preview passes straight through.
  gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - id: gate
        working-directory: scripts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PATHS: |
            modules/terminal
            .github/workflows/deploy-terminal.yml
        run: uv run python deploy_gate.py --event "$EVENT" --sha "$SHA" --paths "$PATHS"

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/terminal
    # PRs get a preview environment; only `main` is the real site. Skipped for PRs from forks, which never have
    # the deployment token, and for a PR being closed, which is `close_preview`'s job.
    if: >-
      needs.gate.outputs.deploy == 'true' &&
      github.event.action != 'closed' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: modules/terminal/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modules/terminal/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Cross-origin, full-URL mode: Static Web Apps cannot proxy the candle WebSocket at all. The three
      # VITE_ENTRA_* values are **public** and go through `vars`, never `secrets` — a client id, a tenant id and a
      # scope name travel in every authorization request the browser makes.
      - run: pnpm build
        env:
          VITE_ARCHIVE_HTTP: https://app-tradingcenter-market-data.azurewebsites.net
          VITE_ARCHIVE_WS: wss://app-tradingcenter-market-data.azurewebsites.net/ws
          # Left unset the panel falls back to `/agent-api`, which Static Web Apps answers with a 404, so nothing
          # leaves the browser and the module's log stays healthy while the tab says it cannot read the catalogue.
          # The host keeps the `-agent` spelling because the App Service does (`local.workbench_app_name`).
          VITE_WORKBENCH_HTTP: https://app-tradingcenter-agent.azurewebsites.net
          # The third time this trap has been walked into: the Accounts tab shipped without this line, the browser
          # got the single-page app back, and the screen said `Unexpected token '<'` while the gateway stayed quiet.
          VITE_GATEWAY_HTTP: https://app-tradingcenter-gateway.azurewebsites.net
          # The prediction-market archive. Its own host and its own scope, like every
          # other back end here.
          VITE_POLYMARKET_HTTP: https://app-tradingcenter-agent.azurewebsites.net/polymarket
          VITE_STRATEGY_HTTP: https://app-tradingcenter-agent.azurewebsites.net/strategy
          VITE_SOCIAL_HTTP: https://app-tradingcenter-agent.azurewebsites.net/social
          VITE_ENTRA_CLIENT_ID: ${{ vars.TERMINAL_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.TERMINAL_ENTRA_TENANT_ID }}
          # **One scope per back end**: a token minted for one module is not sent to another (specs/terminal-identity).
          # Literals rather than four `vars`, being the same kind of public fact as the hostnames beside them — and a
          # scope left out is no credential rather than another module's, which the tab can name.
          VITE_ENTRA_SCOPE: ${{ vars.TERMINAL_ENTRA_SCOPE }}
          VITE_ENTRA_SCOPE_WORKBENCH: api://tradingcenter-agent/access_as_user
          VITE_ENTRA_SCOPE_GATEWAY: api://tradingcenter-capital-gateway/access_as_user
          VITE_ENTRA_SCOPE_POLYMARKET: api://tradingcenter-agent/access_as_user
          VITE_ENTRA_SCOPE_STRATEGY: api://tradingcenter-agent/access_as_user
          VITE_ENTRA_SCOPE_SOCIAL: api://tradingcenter-agent/access_as_user

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "modules/terminal/dist"
          output_location: ""
          skip_app_build: true

      # Only for the real site, since a preview lives on a hostname this does not know. Two assertions, because one
      # has already been wrong: a single-page app whose host does not rewrite unknown paths serves `/` and 404s bookmarks.
      - name: Smoke-check the deployed terminal
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          base="https://white-pond-0508ffe0f.7.azurestaticapps.net"
          for attempt in $(seq 1 10); do
            root=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/" || echo 000)
            deep=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/instruments" || echo 000)
            echo "attempt $attempt: / -> $root, /instruments -> $deep"
            if [ "$root" = "200" ] && [ "$deep" = "200" ]; then
              echo "terminal is serving, deep links included"
              exit 0
            fi
            sleep 10
          done
          echo "::error::terminal did not serve both / ($root) and /instruments ($deep)"
          exit 1

    # Take the preview environment down with the PR that created it: the Free SKU allows three, so the fourth PR gets
    # a hard `BadRequest` on a branch whose own build is fine — seen on #28. No checkout and no build.
  close_preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
