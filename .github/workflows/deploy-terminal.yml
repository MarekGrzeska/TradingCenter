name: deploy-terminal

on:
  push:
    branches: [main]
    paths:
      - "modules/terminal/**"
      - ".github/workflows/deploy-terminal.yml"
  pull_request:
    branches: [main]
    # `closed` is not decoration: a merged PR's preview environment outlives it
    # otherwise, and the Free SKU allows three. See the `close_preview` job.
    types: [opened, synchronize, reopened, closed]
    paths:
      - "modules/terminal/**"
      - ".github/workflows/deploy-terminal.yml"
  workflow_dispatch: {}

# Static Web Apps' GitHub deployment path has no OIDC/federated-credential option as of
# this writing — unlike the two App Service apps (deploy-gateway.yml, deploy-market-data.yml),
# `Azure/static-web-apps-deploy` only takes a deployment token. That token
# (AZURE_STATIC_WEB_APPS_API_TOKEN, from `terraform output terminal_api_key`) is a real,
# narrow exception to design.md's "no stored Azure secret" goal — forced by what Azure's
# own tooling supports today, not a choice made here. Flagged, not hidden.
permissions:
  contents: read
  pull-requests: write # Azure/static-web-apps-deploy comments preview URLs on PRs

concurrency:
  group: deploy-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/terminal
    # PRs get a preview environment; only `main` is the real site. Skipped entirely for
    # PRs from forks, which never have access to the deployment token secret — and for a
    # PR being closed, which is `close_preview`'s job below.
    if: >-
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: modules/terminal/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modules/terminal/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Cross-origin, full-URL mode (src/data/config.ts) — market-data's real hostname,
      # not a relative prefix. Static Web Apps cannot proxy the candle WebSocket at all,
      # so a reverse proxy in front of market-data was never going to cover the whole
      # picture; this is the mode the client code already supports for exactly that
      # reason. What makes cross-origin actually work now lives on both sides: CORS on
      # App Service and the Entra token below.
      #
      # The three VITE_ENTRA_* values are **public** — a client id, a tenant id and a
      # scope name travel in every authorization request the browser makes and are
      # visible to anyone with the developer tools open. They go through `vars`, never
      # `secrets`; this workflow still stores exactly one secret, and it is the Static
      # Web Apps deployment token flagged above.
      #
      # Left unset, the build produces a terminal that attaches no credential — which is
      # the local mode and would fail against the deployed archive. `terraform output
      # terminal_entra_client_id` / `_tenant_id` / `_scope` produce the three values.
      - run: pnpm build
        env:
          VITE_ARCHIVE_HTTP: https://app-tradingcenter-market-data.azurewebsites.net
          VITE_ARCHIVE_WS: wss://app-tradingcenter-market-data.azurewebsites.net/ws
          VITE_ENTRA_CLIENT_ID: ${{ vars.TERMINAL_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.TERMINAL_ENTRA_TENANT_ID }}
          VITE_ENTRA_SCOPE: ${{ vars.TERMINAL_ENTRA_SCOPE }}

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "modules/terminal/dist"
          output_location: ""
          skip_app_build: true

  # Take the preview environment down with the PR that created it.
  #
  # Without this, every merged PR that touched the terminal leaves its environment
  # behind for good. The Free SKU allows three, so the fourth PR does not get a
  # slower deploy — it gets a hard `BadRequest: This Static Web App already has the
  # maximum number of staging environments`, on a branch whose own build is fine.
  # Seen exactly that way on #28, with three environments held by PRs merged hours
  # earlier.
  #
  # No checkout and no build: the action only needs to be told which PR closed, and
  # Static Web Apps works out the environment from that.
  close_preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
