name: deploy-market-mcp

# Only a push to `main` deploys — the pull_request federated credential (github-oidc.tf)
# cannot authenticate to Azure, so this cannot run from a fork's PR by construction.
on:
  push:
    branches: [main]
    paths:
      - "modules/market-mcp/**"
      - ".github/workflows/deploy-market-mcp.yml"
      - ".github/workflows/_deploy-app-service.yml"
      - "scripts/deploy_probe.py"
  workflow_dispatch: {}

# Declared on the caller, and this is where it has to be: a reusable workflow can only
# *narrow* the caller's GITHUB_TOKEN, never widen it. This repository's default workflow
# permission is `read`, and `id-token` is never granted by default at all — so a caller
# without this block hands the shared workflow a token that cannot push to GHCR and cannot
# exchange an OIDC assertion, and every deploy fails at `azure/login`.
permissions:
  contents: read
  id-token: write # azure/login's OIDC exchange
  packages: write # docker push to GHCR

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-app-service.yml
    with:
      module: market-mcp
      app_name: app-tradingcenter-market-mcp
      # `/health` needs none of market-data's `/ws/candles` trick: this route is excluded
      # from Easy Auth (infra/app-service.tf, `excluded_paths`) *and* answers a plain 200
      # with a JSON body on success (specs/market-mcp-transport, "Sonda bez sesji" /
      # "Sonda przy niedostępnym archiwum"). There is no case where a live container
      # answers anything else, so a direct status match is the check, not a workaround.
      #
      # The image is asked for alongside it, and that half was missing until 18 August
      # 2026. Swapping a container in App Service is not instantaneous: for a minute or so
      # after `webapps-deploy` returns the *previous* container is still answering, so a
      # probe reading only HTTP passes on the image being replaced.
      probe_path: /health
      expected_status: 200
      body_contains: '"status"'
      attempts: 12
