name: deploy-gateway

# Only a push to `main` deploys — the pull_request federated credential (github-oidc.tf)
# cannot even authenticate to Azure, so this cannot run from a fork's PR by construction.
on:
  push:
    branches: [main]
    paths:
      - "modules/capital-gateway/**"
      - ".github/workflows/deploy-gateway.yml"
      - ".github/workflows/_deploy-app-service.yml"
      - "scripts/deploy_probe.py"
  workflow_dispatch: {}

# Declared on the caller, and nowhere else will do: a reusable workflow can only *narrow* the caller's token,
# and `id-token` is never granted by default — without this every deploy fails at `azure/login`.
permissions:
  contents: read
  id-token: write # azure/login's OIDC exchange
  packages: write # docker push to GHCR

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-app-service.yml
    with:
      module: capital-gateway
      app_name: app-tradingcenter-gateway
      # The one module whose build context is its own directory: it takes no package, and its Dockerfile
      # copies `pyproject.toml` from the context root.
      build_context: modules/capital-gateway
      # This went without an HTTP probe for two months on a premise nobody checked — an IP restriction that
      # appears nowhere in `infra/`. Matching on `capital-gateway` rather than a status word: the body carries
      # this module's own name, so a 200 from anything else in front of the container cannot pass for it.
      probe_path: "/"
      expected_status: 200
      body_contains: "capital-gateway"
      attempts: 10
      failure_hint: >-
        The container did not answer /. This module refuses to start when a CAPITAL_*
        credential or GATEWAY_API_KEY is missing, and when the host it is bound to is not the
        demo one — the app's log stream says which.
