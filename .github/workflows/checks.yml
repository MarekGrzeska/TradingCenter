name: checks

# Pull requests are the point. Pushes to `main` are the honest complement: `main` can be
# written to directly — the OpenSpec archive commits were exactly that — and a rule
# watching only one door watches none.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Nothing here writes anything.
permissions:
  contents: read

# Three pushes in a row should not mean three sets of PostgreSQL containers.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which modules this change can possibly have broken.
  #
  # Every pull request used to run all three suites, PostgreSQL container included, even
  # when it touched one markdown file — PR #27 changed a single one and paid two minutes
  # for it, and three of the four pull requests around it touched no module at all.
  #
  # Computed here with git rather than with a paths-filter action: the rule is four lines
  # of shell, and it stays legible next to the reasons below instead of inside a
  # third-party action's inputs.
  #
  # There is no branch protection on this repository (a private repository on the free
  # plan cannot have any), so a skipped job blocks nothing and needs no green stand-in.
  # If protection is ever bought, revisit this: a *required* check that never runs leaves
  # a pull request permanently pending, and the fix is a stand-in job, not deleting this.
  changes:
    runs-on: ubuntu-latest
    outputs:
      capital-gateway: ${{ steps.filter.outputs.capital-gateway }}
      market-data: ${{ steps.filter.outputs.market-data }}
      market-mcp: ${{ steps.filter.outputs.market-mcp }}
      trading-mcp: ${{ steps.filter.outputs.trading-mcp }}
      teams-mcp: ${{ steps.filter.outputs.teams-mcp }}
      agent: ${{ steps.filter.outputs.agent }}
      teams: ${{ steps.filter.outputs.teams }}
      terminal: ${{ steps.filter.outputs.terminal }}
      openspec: ${{ steps.filter.outputs.openspec }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Both diffs below need the base commit, which a shallow clone does not have.
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # A push's `before` is all-zeroes for the first push to a branch, and points
            # at a commit that no longer exists after a force-push. Either way, falling
            # back to the parent of HEAD keeps the diff honest rather than empty — and an
            # empty diff here would skip every job, which is the one wrong answer.
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "changed files:"
          echo "$changed" | sed 's/^/  /'

          matches() { printf '%s\n' "$changed" | grep -qE "$1"; }

          # This workflow itself is in every list: a change to how the checks run has to
          # be exercised by running them.
          self='^\.github/workflows/checks\.yml$'

          gateway='^modules/capital-gateway/'
          archive='^modules/market-data/'
          agent='^modules/agent/'
          teams='^modules/teams/'
          # The terminal's `contract:check` compares its generated types against the
          # schema market-data builds from `contract.py`. Filtering the terminal on its
          # own directory alone would let a contract change land with the check that
          # exists to catch it never running — the exact failure the check was added for.
          #
          # `agent/contract.py` joins it for the same reason even though it is not wired
          # into `contract:generate` (design.md, "Kontrakt terminala pisany ręcznie, bez
          # generatora") — the terminal's hand-written DTOs in `agentApi.ts` are the
          # check for *that* contract, and they only run if this job does.
          #
          # `teams` is the third, and it is the generated kind: from the add-teams-module
          # change on, `contract:generate` reads two schema sources and writes a file per
          # source, so a change there leaves the terminal's committed types stale exactly
          # the way market-data's would. The whole module rather than its `contract.py`,
          # for the reason written out at `teamsmcp` below — that file imports models it
          # does not define, and one of them going stale is a thing that has happened.
          terminal='^modules/terminal/|^modules/market-data/market_data/contract\.py$|^modules/agent/agent/contract\.py$|^modules/teams/'
          # Same reasoning as the terminal's own filter, one line up: market-mcp keeps a
          # committed snapshot of the same contract (`contract/market-data.openapi.json`),
          # and `test_contract.py` is the check that catches it going stale.
          mcp='^modules/market-mcp/|^modules/market-data/market_data/contract\.py$'
          # The same rule again, one module along: trading-mcp keeps a committed snapshot
          # of capital-gateway's whole OpenAPI document (`contract/capital-gateway.
          # openapi.json`), and `scripts/contract.py check` is what catches it going
          # stale. The gateway's *whole* directory, not one file: that document is built
          # from its routes as well as its DTOs, so there is no narrower honest filter.
          trading='^modules/trading-mcp/|^modules/capital-gateway/'
          # And once more, one module further in: teams-mcp keeps a committed snapshot of
          # teams' OpenAPI document (`contract/teams.openapi.json`).
          #
          # This used to watch `teams/teams/contract.py` alone, on the theory that teams
          # prints its document from that file's models and so nowhere else can move it.
          # Measured wrong on 17 August 2026: `weekdays-on-the-shorter-rhythms` touched
          # only `recurrence.py`, whose `Recurrence` docstring *is* a description in the
          # schema — the snapshot went stale, this job never ran, and the PR merged green.
          # `contract.py` imports its models rather than defining them all, and the
          # document is built from routes as well, so the whole module is the only honest
          # filter — the same conclusion trading-mcp's reached one line up.
          teamsmcp='^modules/teams-mcp/|^modules/teams/'
          # The archive-shape check, plus the script that is the shape.
          specs='^openspec/|^scripts/trim-openspec-archive\.sh$'

          for name in capital-gateway market-data market-mcp trading-mcp teams-mcp agent teams terminal openspec; do
            case "$name" in
              capital-gateway) pattern="$gateway" ;;
              market-data)     pattern="$archive" ;;
              market-mcp)      pattern="$mcp" ;;
              trading-mcp)     pattern="$trading" ;;
              teams-mcp)       pattern="$teamsmcp" ;;
              agent)           pattern="$agent" ;;
              teams)           pattern="$teams" ;;
              terminal)        pattern="$terminal" ;;
              openspec)        pattern="$specs" ;;
            esac
            if matches "$pattern|$self"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "--- decisions ---"
          cat "$GITHUB_OUTPUT"

  capital-gateway:
    name: capital-gateway
    needs: changes
    if: needs.changes.outputs.capital-gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/capital-gateway
    steps:
      - uses: actions/checkout@v4
      # uv provisions the interpreter from `requires-python`, so there is no separate
      # setup-python: two things deciding the version is one too many.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      # Types, which ruff does not check. Scope and mode are in `[tool.pyright]`; the
      # version is pinned in the same file, so this step answers the same way twice.
      - run: uv run pyright
      - run: uv run pytest -q

  market-data:
    name: market-data
    needs: changes
    if: needs.changes.outputs.market-data == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/market-data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      # Types, which ruff does not check. Scope and mode are in `[tool.pyright]`; the
      # version is pinned in the same file, so this step answers the same way twice.
      - run: uv run pyright
      # The 273 `db` tests are gated on Docker rather than on a flag, and this runner has
      # it, so testcontainers starts a real PostgreSQL and they run. That is the intent:
      # they cover the coverage and rollup logic, which has been wrong twice. The 7 that
      # skip are the `live` ones, which need a Capital session and stay behind --run-live.
      - run: uv run pytest -q

  market-mcp:
    name: market-mcp
    needs: changes
    if: needs.changes.outputs.market-mcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/market-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Before the tests, not after — same reasoning as the terminal's own
      # `contract:check` below. `scripts/contract.py` reaches into `../market-data`
      # itself (a sibling checkout in this same runner) and needs no database, no
      # gateway and no running server to do it.
      - run: uv run python scripts/contract.py check
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q

  trading-mcp:
    name: trading-mcp
    needs: changes
    if: needs.changes.outputs.trading-mcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/trading-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Before the tests, same as market-mcp's own: `scripts/contract.py` reaches into
      # `../capital-gateway` in this same checkout and reads its OpenAPI document off the
      # app object — no database, no provider session and no CAPITAL_* credentials, since
      # that module builds its Settings inside `lifespan` rather than at import.
      - run: uv run python scripts/contract.py check
      - run: uv run ruff check .
      - run: uv run pyright
      # Nothing here reaches capital.com or a running gateway: every test doubles the
      # upstream. The demo-only guard is exercised against that double, which is the only
      # place it can be exercised without an account to refuse.
      - run: uv run pytest -q

  teams-mcp:
    name: teams-mcp
    needs: changes
    if: needs.changes.outputs.teams-mcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/teams-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Before the tests, same as both other MCP modules': `scripts/contract.py` runs
      # `python -m teams.openapi` in `../teams` from this same checkout, which needs no
      # database, no OpenAI key and no market-mcp — that module builds its Settings inside
      # `lifespan` rather than at import.
      - run: uv run python scripts/contract.py check
      - run: uv run ruff check .
      - run: uv run pyright
      # Nothing here reaches a running teams: every test doubles it. What cannot be
      # doubled — whether Easy Auth passes the operator's token through — is not a test,
      # it is the deployment check in this change's review.md.
      - run: uv run pytest -q

  agent:
    name: agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      # Types, which ruff does not check. Scope and mode are in `[tool.pyright]`; the
      # version is pinned in the same file, so this step answers the same way twice.
      - run: uv run pyright
      # Same as market-data's own step: the `db` tests are gated on Docker inside
      # conftest.py, not on a flag, and this runner has it — so one `pytest -q` also
      # runs them, real PostgreSQL and all. `live` tests need a real OpenAI key and
      # stay behind --run-live, never here.
      - run: uv run pytest -q

  teams:
    name: teams
    needs: changes
    if: needs.changes.outputs.teams == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/teams
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      # Types, which ruff does not check. Scope and mode are in `[tool.pyright]`; the
      # version is pinned in the same file, so this step answers the same way twice.
      - run: uv run pyright
      # Same as market-data's and agent's: the `db` tests are gated on Docker inside
      # conftest.py rather than on a flag, and this runner has it — so one `pytest -q`
      # runs the migration tests against a real PostgreSQL too. Nothing here reaches
      # OpenAI or market-mcp; anything that would is a `live` test behind `--run-live`.
      - run: uv run pytest -q

  terminal:
    name: terminal
    needs: changes
    if: needs.changes.outputs.terminal == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/terminal
    steps:
      - uses: actions/checkout@v4
      # Version comes from `packageManager` in package.json — one place both CI and a
      # developer read, instead of knowledge living in a review document. The path is
      # spelled out because `defaults.run.working-directory` applies to `run` steps and
      # not to actions: without it this looks for a package.json in the repository root,
      # where there is none, and fails before anything is installed.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: modules/terminal/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modules/terminal/pnpm-lock.yaml
      # `contract:check` regenerates the wire types from market-data's Python, so this job
      # needs both toolchains. Giving it uv is one step; giving a separate job Node and an
      # install would duplicate the expensive half.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # Before the tests, not after. A stale generated contract means every conclusion the
      # suite reaches about the wire is drawn from an out-of-date premise.
      - run: pnpm contract:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # An archived change keeps proposal, design and review. Its delta specs were merged into
  # `openspec/specs/` by the archive itself and its ticked `tasks.md` is a worse account of
  # the work than the commits are, so both are removed on the way in — and a copy that
  # lives twice is a copy that drifts.
  #
  # `/opsx:archive` is told to run the script (`openspec/config.yaml`, `operations.archive`,
  # verified to reach the workflow through `openspec instructions archive --json`). That
  # channel is advisory by its own contract, which makes it the right place for the rule
  # and the wrong place to leave it alone: this step is what notices the archive where it
  # was not followed. One checkout and one script — there is nothing to install.
  openspec:
    name: openspec
    needs: changes
    if: needs.changes.outputs.openspec == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/trim-openspec-archive.sh --check
