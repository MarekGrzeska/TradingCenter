name: checks

# Pull requests are the point. Pushes to `main` are the honest complement: `main` can be
# written to directly — the OpenSpec archive commits were exactly that — and a rule
# watching only one door watches none.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Nothing here writes anything.
permissions:
  contents: read

# Three pushes in a row should not mean three sets of PostgreSQL containers.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which modules this change can possibly have broken.
  #
  # Every pull request used to run all three suites, PostgreSQL container included, even
  # when it touched one markdown file — PR #27 changed a single one and paid two minutes
  # for it, and three of the four pull requests around it touched no module at all.
  #
  # Computed here with git rather than with a paths-filter action: the rule is four lines
  # of shell, and it stays legible next to the reasons below instead of inside a
  # third-party action's inputs.
  #
  # There is no branch protection on this repository (a private repository on the free
  # plan cannot have any), so a skipped job blocks nothing and needs no green stand-in.
  # If protection is ever bought, revisit this: a *required* check that never runs leaves
  # a pull request permanently pending, and the fix is a stand-in job, not deleting this.
  changes:
    runs-on: ubuntu-latest
    outputs:
      capital-gateway: ${{ steps.filter.outputs.capital-gateway }}
      market-data: ${{ steps.filter.outputs.market-data }}
      trading-mcp: ${{ steps.filter.outputs.trading-mcp }}
      teams-mcp: ${{ steps.filter.outputs.teams-mcp }}
      agent: ${{ steps.filter.outputs.agent }}
      teams: ${{ steps.filter.outputs.teams }}
      terminal: ${{ steps.filter.outputs.terminal }}
      openspec: ${{ steps.filter.outputs.openspec }}
      packages: ${{ steps.filter.outputs.packages }}
      scripts: ${{ steps.filter.outputs.scripts }}
      infra: ${{ steps.filter.outputs.infra }}
      # The matrix the `packages` job runs: the diff's package names intersected with
      # the directory. The diff alone would list a package this PR deletes (whose
      # working-directory no longer exists); the directory alone runs all three on a
      # one-package edit, which is what this used to do. A package added by the PR is
      # in the diff by definition, so the original hazard — a job going green having
      # tested somebody else's package — stays closed. Empty means the `packages`
      # output fired on this file itself; then every package runs, because a change
      # to how the checks run has to be exercised by running them.
      package-list: ${{ steps.filter.outputs.package-list }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Both diffs below need the base commit, which a shallow clone does not have.
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # A push's `before` is all-zeroes for the first push to a branch, and points
            # at a commit that no longer exists after a force-push. Either way, falling
            # back to the parent of HEAD keeps the diff honest rather than empty — and an
            # empty diff here would skip every job, which is the one wrong answer.
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "changed files:"
          echo "$changed" | sed 's/^/  /'

          matches() { printf '%s\n' "$changed" | grep -qE "$1"; }

          # This workflow itself is in every list: a change to how the checks run has to
          # be exercised by running them.
          self='^\.github/workflows/checks\.yml$'

          # Packages first, because module patterns below refer to them. A module's own
          # directory plus every package it takes as a path dependency: the package is
          # compiled into that module's image, so a change there can break it exactly the
          # way a change in its own tree can. This is the whole price of sharing source,
          # and it is paid in CI rather than in production
          # (packages-replace-the-hand-copies/design.md, D5).
          tc_runtime='^packages/tc-runtime/'
          tc_openai='^packages/tc-openai/'
          tc_mcp_kit='^packages/tc-mcp-kit/'

          # Keyed by the job name each pattern decides, so there is one list of names
          # rather than two. The `case` block this replaces existed for one reason — a bash
          # variable name cannot hold a hyphen — and it meant every new job was two edits in
          # two places, which is how a name gets added to one list and not the other.
          declare -A PATTERNS=()

          PATTERNS[capital-gateway]='^modules/capital-gateway/'
          PATTERNS[market-data]="^modules/market-data/|$tc_runtime|$tc_mcp_kit"
          PATTERNS[agent]="^modules/agent/|$tc_runtime|$tc_openai"
          PATTERNS[teams]="^modules/teams/|$tc_runtime|$tc_openai"
          # The terminal's `contract:check` compares its generated types against the
          # schema market-data builds from `contract.py`. Filtering the terminal on its
          # own directory alone would let a contract change land with the check that
          # exists to catch it never running — the exact failure the check was added for.
          #
          # `agent/contract.py` joins it for the same reason even though it is not wired
          # into `contract:generate` (design.md, "Kontrakt terminala pisany ręcznie, bez
          # generatora") — the terminal's hand-written DTOs in `agentApi.ts` are the
          # check for *that* contract, and they only run if this job does.
          #
          # `teams` is the third, and it is the generated kind: from the add-teams-module
          # change on, `contract:generate` reads two schema sources and writes a file per
          # source, so a change there leaves the terminal's committed types stale exactly
          # the way market-data's would. The whole module rather than its `contract.py`,
          # for the reason written out at `teamsmcp` below — that file imports models it
          # does not define, and one of them going stale is a thing that has happened.
          PATTERNS[terminal]='^modules/terminal/|^modules/market-data/market_data/contract\.py$|^modules/agent/agent/contract\.py$|^modules/teams/'
          # market-data takes `tc-mcp-kit` too since the tool surface moved into it: the
          # package's schema slimmer is what keeps eleven tools under their published
          # ceiling, and a change there is a change to what the archive announces.
          # The same rule again, one module along: trading-mcp keeps a committed snapshot
          # of capital-gateway's whole OpenAPI document (`contract/capital-gateway.
          # openapi.json`), and `scripts/contract.py check` is what catches it going
          # stale. The gateway's *whole* directory, not one file: that document is built
          # from its routes as well as its DTOs, so there is no narrower honest filter.
          PATTERNS[trading-mcp]="^modules/trading-mcp/|^modules/capital-gateway/|$tc_mcp_kit"
          # And once more, one module further in: teams-mcp keeps a committed snapshot of
          # teams' OpenAPI document (`contract/teams.openapi.json`).
          #
          # This used to watch `teams/teams/contract.py` alone, on the theory that teams
          # prints its document from that file's models and so nowhere else can move it.
          # Measured wrong on 17 August 2026: `weekdays-on-the-shorter-rhythms` touched
          # only `recurrence.py`, whose `Recurrence` docstring *is* a description in the
          # schema — the snapshot went stale, this job never ran, and the PR merged green.
          # `contract.py` imports its models rather than defining them all, and the
          # document is built from routes as well, so the whole module is the only honest
          # filter — the same conclusion trading-mcp's reached one line up.
          PATTERNS[teams-mcp]="^modules/teams-mcp/|^modules/teams/|$tc_mcp_kit"
          # The archive-shape check, plus the script that is the shape.
          PATTERNS[openspec]='^openspec/|^scripts/trim-openspec-archive\.sh$'
          PATTERNS[packages]='^packages/'
          # Repository tooling with tests of its own since one-deploy-path-one-dev-runner:
          # the dev-stack runner and the probe every deploy workflow ends in.
          PATTERNS[scripts]='^scripts/'
          # Terraform reached `main` unvalidated until 18 August 2026: `terraform.yml` runs
          # on pull_request only, so a push straight to `main` passed through nothing at
          # all. `fmt` and `validate` need no credentials and no state, so they belong here
          # rather than there. Both roots — `infra/bootstrap/` keeps its own state.
          PATTERNS[infra]='^infra/'

          for name in "${!PATTERNS[@]}"; do
            if matches "${PATTERNS[$name]}|$self"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          done
          # See the `package-list` output above for why this is diff ∩ directory.
          #
          # Assembled without jq, which this step used to reach for. `jq` is on the CI
          # runner and is not in the `/usr/bin:/bin` this step's own test pins, so a jq
          # here is a step that runs green in CI and cannot execute where the test runs —
          # the shape of defence this repository stopped accepting when the audit landed.
          all_pkgs="$(ls -1 packages)"
          touched="$(printf '%s\n' "$changed" | sed -n 's|^packages/\([^/]*\)/.*|\1|p' | sort -u)"
          # Read line by line rather than `for p in $list`: word splitting would cut a
          # directory name containing a space into two names that both look fine, and the
          # guard below would then wave through a matrix entry nothing can run in.
          list=""
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if printf '%s\n' "$all_pkgs" | grep -qxF "$p"; then
              list="$list$p"$'\n'
            fi
          done <<< "$touched"
          if [ -z "$list" ]; then
            list="$all_pkgs"
          fi
          json=""
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            # A name needing JSON escaping is also a broken matrix entry and a
            # working-directory no job can enter. Refuse it here, where it names itself,
            # rather than three jobs later as a quoting error in someone else's YAML.
            case "$p" in
              *[!A-Za-z0-9._-]*)
                echo "package directory is not matrix-safe: $p" >&2
                exit 1
                ;;
            esac
            json="$json${json:+,}\"$p\""
          done <<< "$list"
          echo "package-list=[$json]" >> "$GITHUB_OUTPUT"
          echo "--- decisions ---"
          cat "$GITHUB_OUTPUT"

  capital-gateway:
    name: capital-gateway
    needs: changes
    if: needs.changes.outputs.capital-gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/capital-gateway
    steps:
      - uses: actions/checkout@v4
      # uv provisions the interpreter from `requires-python`, so there is no separate
      # setup-python: two things deciding the version is one too many.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      # Types, which ruff does not check. Scope and mode are in `[tool.pyright]`; the
      # version is pinned in the same file, so this step answers the same way twice.
      - run: uv run pyright
      - run: uv run pytest -q

  market-data:
    name: market-data
    needs: changes
    if: needs.changes.outputs.market-data == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/market-data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      # Types, which ruff does not check. Scope and mode are in `[tool.pyright]`; the
      # version is pinned in the same file, so this step answers the same way twice.
      - run: uv run pyright
      # The 273 `db` tests are gated on Docker rather than on a flag, and this runner has
      # it, so testcontainers starts a real PostgreSQL and they run. That is the intent:
      # they cover the coverage and rollup logic, which has been wrong twice. The 7 that
      # skip are the `live` ones, which need a Capital session and stay behind --run-live.
      - run: uv run pytest -q

  trading-mcp:
    name: trading-mcp
    needs: changes
    if: needs.changes.outputs.trading-mcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/trading-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Before the tests rather than after: `scripts/contract.py` reaches into
      # `../capital-gateway` in this same checkout and reads its OpenAPI document off the
      # app object — no database, no provider session and no CAPITAL_* credentials, since
      # that module builds its Settings inside `lifespan` rather than at import.
      - run: uv run python scripts/contract.py check
      - run: uv run ruff check .
      - run: uv run pyright
      # Nothing here reaches capital.com or a running gateway: every test doubles the
      # upstream. The demo-only guard is exercised against that double, which is the only
      # place it can be exercised without an account to refuse.
      - run: uv run pytest -q

  teams-mcp:
    name: teams-mcp
    needs: changes
    if: needs.changes.outputs.teams-mcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/teams-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Before the tests, same as both other MCP modules': `scripts/contract.py` runs
      # `python -m teams.openapi` in `../teams` from this same checkout, which needs no
      # database, no OpenAI key and no tool server — that module builds its Settings inside
      # `lifespan` rather than at import.
      - run: uv run python scripts/contract.py check
      - run: uv run ruff check .
      - run: uv run pyright
      # Nothing here reaches a running teams: every test doubles it. What cannot be
      # doubled — whether Easy Auth passes the operator's token through — is not a test,
      # it is the deployment check in this change's review.md.
      - run: uv run pytest -q

  packages:
    name: packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One job per package rather than a loop, so a failure names which one — and the
      # list comes from `changes`, which intersects the diff with the directory, so a
      # one-package edit runs one package and adding a package cannot leave it
      # untested while the job reports green.
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.package-list) }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run pyright
      # The package's own tests only. What proves a package change is safe for its
      # consumers is that *their* jobs run too — the filter above adds every module that
      # takes the package as a path dependency, so this job never stands alone.
      - run: uv run pytest -q

  agent:
    name: agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      # Types, which ruff does not check. Scope and mode are in `[tool.pyright]`; the
      # version is pinned in the same file, so this step answers the same way twice.
      - run: uv run pyright
      # Same as market-data's own step: the `db` tests are gated on Docker inside
      # conftest.py, not on a flag, and this runner has it — so one `pytest -q` also
      # runs them, real PostgreSQL and all. `live` tests need a real OpenAI key and
      # stay behind --run-live, never here.
      - run: uv run pytest -q

  teams:
    name: teams
    needs: changes
    if: needs.changes.outputs.teams == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/teams
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      # Types, which ruff does not check. Scope and mode are in `[tool.pyright]`; the
      # version is pinned in the same file, so this step answers the same way twice.
      - run: uv run pyright
      # Same as market-data's and agent's: the `db` tests are gated on Docker inside
      # conftest.py rather than on a flag, and this runner has it — so one `pytest -q`
      # runs the migration tests against a real PostgreSQL too. Nothing here reaches
      # OpenAI or a tool server; anything that would is a `live` test behind `--run-live`.
      - run: uv run pytest -q

  terminal:
    name: terminal
    needs: changes
    if: needs.changes.outputs.terminal == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/terminal
    steps:
      - uses: actions/checkout@v4
      # Version comes from `packageManager` in package.json — one place both CI and a
      # developer read, instead of knowledge living in a review document. The path is
      # spelled out because `defaults.run.working-directory` applies to `run` steps and
      # not to actions: without it this looks for a package.json in the repository root,
      # where there is none, and fails before anything is installed.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: modules/terminal/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modules/terminal/pnpm-lock.yaml
      # `contract:check` regenerates the wire types from market-data's Python, so this job
      # needs both toolchains. Giving it uv is one step; giving a separate job Node and an
      # install would duplicate the expensive half.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # Before the tests, not after. A stale generated contract means every conclusion the
      # suite reaches about the wire is drawn from an out-of-date premise.
      - run: pnpm contract:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The dev-stack runner and the deploy probe. Both were shell with no tests until
  # one-deploy-path-one-dev-runner, and both are defences: the runner refuses a mismatched
  # gateway key and a non-loopback database before it starts anything, and the probe is what
  # stood over a crash-looping container on 16 August 2026 reporting green. The same three
  # commands every module runs, so a rule that passes in a module passes here.
  scripts:
    name: scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q

  # Terraform reached `main` unvalidated: `terraform.yml` runs a full plan, but only on
  # pull_request, so a push straight to `main` with infrastructure in it passed through
  # nothing at all. `apply` stays with the operator and CI stays unable to do it — none of
  # that changes here. What changes is that `fmt` and `validate` now run on both doors, and
  # they can, because neither needs a credential or the state:
  # `init -backend=false` downloads the providers and stops.
  #
  # Both roots. `infra/bootstrap/` is a separate root with its own committed local state,
  # and it was outside every check until now.
  infra:
    name: infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Formatting, both roots
        run: terraform fmt -check -recursive infra
      - name: Validate infra
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate infra/bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # An archived change keeps proposal, design and review. Its delta specs were merged into
  # `openspec/specs/` by the archive itself and its ticked `tasks.md` is a worse account of
  # the work than the commits are, so both are removed on the way in — and a copy that
  # lives twice is a copy that drifts.
  #
  # `/opsx:archive` is told to run the script (`openspec/config.yaml`, `operations.archive`,
  # verified to reach the workflow through `openspec instructions archive --json`). That
  # channel is advisory by its own contract, which makes it the right place for the rule
  # and the wrong place to leave it alone: this step is what notices the archive where it
  # was not followed. One checkout and one script — there is nothing to install.
  openspec:
    name: openspec
    needs: changes
    if: needs.changes.outputs.openspec == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/trim-openspec-archive.sh --check
