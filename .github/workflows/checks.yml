name: checks

# Pull requests are the point. Pushes to `main` are the honest complement: `main` can be written to directly —
# the OpenSpec archive commits were exactly that — and a rule watching only one door watches none.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Nothing here writes anything.
permissions:
  contents: read

# Three pushes in a row should not mean three sets of PostgreSQL containers.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which modules this change can possibly have broken — every pull request used to run all three suites for a
  # markdown file. There is no branch protection here, so a skipped job blocks nothing and needs no stand-in.
  changes:
    runs-on: ubuntu-latest
    outputs:
      capital-gateway: ${{ steps.filter.outputs.capital-gateway }}
      market-data: ${{ steps.filter.outputs.market-data }}
      trading-mcp: ${{ steps.filter.outputs.trading-mcp }}
      polymarket-data: ${{ steps.filter.outputs.polymarket-data }}
      strategy: ${{ steps.filter.outputs.strategy }}
      workbench: ${{ steps.filter.outputs.workbench }}
      terminal: ${{ steps.filter.outputs.terminal }}
      pocket: ${{ steps.filter.outputs.pocket }}
      openspec: ${{ steps.filter.outputs.openspec }}
      packages: ${{ steps.filter.outputs.packages }}
      scripts: ${{ steps.filter.outputs.scripts }}
      infra: ${{ steps.filter.outputs.infra }}
      # The diff's package names intersected with the directory: the diff alone lists a package this PR deletes,
      # the directory alone runs all three on a one-package edit. Empty means this file itself changed.
      package-list: ${{ steps.filter.outputs.package-list }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Both diffs below need the base commit, which a shallow clone does not have.
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # A push's `before` is all-zeroes for a branch's first push and stale after a force-push. Falling back
            # to the parent of HEAD keeps the diff honest — an empty diff here would skip every job.
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "changed files:"
          echo "$changed" | sed 's/^/  /'

          matches() { printf '%s\n' "$changed" | grep -qE "$1"; }

          # This workflow itself is in every list: a change to how the checks run has to
          # be exercised by running them.
          self='^\.github/workflows/checks\.yml$'

          # Packages first, because the module patterns below refer to them. A package is compiled into the image,
          # so a change there breaks a module exactly the way its own tree does — the price of sharing source.
          tc_runtime='^packages/tc-runtime/'
          tc_openai='^packages/tc-openai/'
          tc_mcp_kit='^packages/tc-mcp-kit/'

          # Keyed by the job name each pattern decides, so there is one list of names rather than two. The `case`
          # block this replaces existed because a bash variable cannot hold a hyphen, and cost two edits per job.
          declare -A PATTERNS=()

          PATTERNS[capital-gateway]='^modules/capital-gateway/'
          PATTERNS[market-data]="^modules/market-data/|$tc_runtime|$tc_mcp_kit"
          # One module where there were three. It takes `tc-mcp-kit` as well as the
          # other two, because the team tools moved into it with their schema slimmer.
          PATTERNS[workbench]="^modules/workbench/|$tc_runtime|$tc_openai|$tc_mcp_kit"
          # The terminal is filtered on four other modules because its `contract:check` is the check for those seams.
          # The workbench whole, since its schema is built from routes and from models those files import.
          PATTERNS[terminal]='^modules/terminal/|^modules/market-data/market_data/contract\.py$|^modules/workbench/|^modules/polymarket-data/polymarket_data/(contract|openapi)\.py$|^modules/strategy/strategy/(contract|openapi|rule)\.py$'
          # market-data takes `tc-mcp-kit` since the tool surface moved in — the slimmer keeps eleven tools under their
          # ceiling. trading-mcp watches the gateway's *whole* directory: its snapshot is built from routes and DTOs both.
          # The second front end, filtered on the one module it reads: it keeps its own generated copy of that
          # schema, so `contract:check` there is the check for this seam exactly as it is for the terminal.
          PATTERNS[pocket]='^modules/pocket/|^modules/polymarket-data/polymarket_data/(contract|openapi)\.py$'
          PATTERNS[trading-mcp]="^modules/trading-mcp/|^modules/capital-gateway/|$tc_mcp_kit"
          # The same two packages as market-data, for the same two reasons. It has no upstream in this repository, so
          # unlike trading-mcp there is no second module in this pattern.
          PATTERNS[polymarket-data]="^modules/polymarket-data/|$tc_runtime|$tc_mcp_kit"
          # No third pairing here, deliberately: this module reads market-data over its published REST contract at
          # runtime and keeps no snapshot of it, so there is nothing to go stale.
          PATTERNS[strategy]="^modules/strategy/|$tc_runtime|$tc_mcp_kit"
          # The archive-shape check, plus the script that is the shape. There used to be a third pairing above —
          # teams-mcp's snapshot of the teams document — gone with the module that kept it.
          PATTERNS[openspec]='^openspec/|^scripts/trim-openspec-archive\.sh$'
          PATTERNS[packages]='^packages/'
          # Repository tooling with tests of its own. `CLAUDE.md` is here because `test_guide_ceiling.py` reads it:
          # filtered on `^scripts/` alone, an edit to the guide ran none of the guard written against it.
          PATTERNS[scripts]='^scripts/|^CLAUDE\.md$'
          # Terraform reached `main` unvalidated until 18 August 2026, since `terraform.yml` runs on pull_request only.
          # `fmt` and `validate` need no credentials, so they belong here. Both roots — bootstrap keeps its own state.
          PATTERNS[infra]='^infra/'

          for name in "${!PATTERNS[@]}"; do
            if matches "${PATTERNS[$name]}|$self"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          done
          # See the `package-list` output above for why this is diff ∩ directory. Assembled without jq, which is on the
          # runner but not in the `/usr/bin:/bin` this step's own test pins — green in CI, unrunnable where it is tested.
          all_pkgs="$(ls -1 packages)"
          touched="$(printf '%s\n' "$changed" | sed -n 's|^packages/\([^/]*\)/.*|\1|p' | sort -u)"
          # Read line by line rather than `for p in $list`: word splitting would cut a directory name containing a
          # space into two names that both look fine, and the guard below would wave the matrix entry through.
          list=""
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if printf '%s\n' "$all_pkgs" | grep -qxF "$p"; then
              list="$list$p"$'\n'
            fi
          done <<< "$touched"
          if [ -z "$list" ]; then
            list="$all_pkgs"
          fi
          json=""
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            # A name needing JSON escaping is also a broken matrix entry and a working-directory no job can enter.
            # Refused here, where it names itself, rather than three jobs later as a quoting error.
            case "$p" in
              *[!A-Za-z0-9._-]*)
                echo "package directory is not matrix-safe: $p" >&2
                exit 1
                ;;
            esac
            json="$json${json:+,}\"$p\""
          done <<< "$list"
          echo "package-list=[$json]" >> "$GITHUB_OUTPUT"
          echo "--- decisions ---"
          cat "$GITHUB_OUTPUT"

  capital-gateway:
    name: capital-gateway
    needs: changes
    if: needs.changes.outputs.capital-gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/capital-gateway
    steps:
      - uses: actions/checkout@v4
      # uv provisions the interpreter from `requires-python`, so there is no separate
      # setup-python: two things deciding the version is one too many.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      # Types, which ruff does not check. Scope and mode are in `[tool.pyright]`; the
      # version is pinned in the same file, so this step answers the same way twice.
      - run: uv run pyright
      - run: uv run pytest -q

  market-data:
    name: market-data
    needs: changes
    if: needs.changes.outputs.market-data == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/market-data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      # Types, which ruff does not check. Scope and mode are in `[tool.pyright]`; the
      # version is pinned in the same file, so this step answers the same way twice.
      - run: uv run pyright
      # The `db` tests are gated on Docker rather than on a flag and this runner has it, so a real PostgreSQL
      # starts and they run — they cover the coverage and rollup logic, which has been wrong twice.
      - run: uv run pytest -q

  trading-mcp:
    name: trading-mcp
    needs: changes
    if: needs.changes.outputs.trading-mcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/trading-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Before the tests rather than after: `scripts/contract.py` reads the gateway's OpenAPI off the app object
      # in this same checkout — no database and no credentials, since that module builds Settings in `lifespan`.
      - run: uv run python scripts/contract.py check
      - run: uv run ruff check .
      - run: uv run pyright
      # Nothing here reaches capital.com or a running gateway: every test doubles the upstream, which is the only
      # place the demo-only guard can be exercised without an account to refuse.
      - run: uv run pytest -q

  polymarket-data:
    name: polymarket-data
    needs: changes
    if: needs.changes.outputs.polymarket-data == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/polymarket-data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run pyright
      # The `db` tests are gated on Docker and this runner has it, so they run. The `live` ones stay behind
      # --run-live: they read the real Polymarket API, which is a third party's availability, not correctness here.
      - run: uv run pytest -q

  strategy:
    name: strategy
    needs: changes
    if: needs.changes.outputs.strategy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/strategy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run pyright
      # The `db` tests are gated on Docker and this runner has it, so they run. Nothing reaches market-data: the
      # archive is an HTTP contract doubled at the transport, which is where the "cannot see" refusals come from.
      - run: uv run pytest -q

  packages:
    name: packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One job per package rather than a loop, so a failure names which one, and the list comes from `changes`:
      # a one-package edit runs one package, and adding a package cannot leave it untested while the job is green.
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.package-list) }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run pyright
      # The package's own tests only. What proves a package change safe for its consumers is that *their* jobs run
      # too — the filter adds every module taking it as a path dependency, so this job never stands alone.
      - run: uv run pytest -q

  workbench:
    name: workbench
    needs: changes
    if: needs.changes.outputs.workbench == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      # Types, which ruff does not check. Scope and mode are in `[tool.pyright]`; the
      # version is pinned in the same file, so this step answers the same way twice.
      - run: uv run pyright
      # The `db` tests are gated on Docker, so one `pytest -q` runs them against two real PostgreSQL containers,
      # one per schema. `live` tests need a real OpenAI key and stay behind --run-live.
      - run: uv run pytest -q

  terminal:
    name: terminal
    needs: changes
    if: needs.changes.outputs.terminal == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/terminal
    steps:
      - uses: actions/checkout@v4
      # Version comes from `packageManager` in package.json, one place both CI and a developer read. The path is
      # spelled out because `defaults.run.working-directory` applies to `run` steps and not to actions.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: modules/terminal/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modules/terminal/pnpm-lock.yaml
      # `contract:check` regenerates the wire types from Python, so this job needs both toolchains. Giving a
      # separate job Node and an install would duplicate the expensive half.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # Before the tests, not after. A stale generated contract means every conclusion the
      # suite reaches about the wire is drawn from an out-of-date premise.
      - run: pnpm contract:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The phone screen. Same shape as the terminal's job and for the same reason: its wire types are generated from
  # polymarket-data's Python, so the check needs both toolchains and a stale contract fails before the suite runs.
  pocket:
    name: pocket
    needs: changes
    if: needs.changes.outputs.pocket == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/pocket
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: modules/pocket/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modules/pocket/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The dev-stack runner and the deploy probe: both were shell with no tests, and both are defences — the runner
  # refuses a mismatched gateway key before starting anything, the probe is what reported green over a crash loop.
  scripts:
    name: scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q

  # Terraform reached `main` unvalidated, since `terraform.yml` runs on pull_request only. `apply` stays with the
  # operator; what changes is that `fmt` and `validate` run on both doors, needing neither credential nor state.
  infra:
    name: infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Formatting, both roots
        run: terraform fmt -check -recursive infra
      - name: Validate infra
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate infra/bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # An archived change keeps proposal, design and review: its delta specs were merged into `openspec/specs/` and a
  # copy that lives twice drifts. `/opsx:archive` is told to run the script, and that channel is advisory — this
  # step is what notices the archive where it was not followed.
  openspec:
    name: openspec
    needs: changes
    if: needs.changes.outputs.openspec == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/trim-openspec-archive.sh --check
