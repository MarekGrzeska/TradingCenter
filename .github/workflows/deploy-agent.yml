name: deploy-agent

# Only a push to `main` deploys — the pull_request federated credential (github-oidc.tf)
# cannot even authenticate to Azure, so this cannot run from a fork's PR by construction.
on:
  push:
    branches: [main]
    paths:
      - "modules/agent/**"
      - ".github/workflows/deploy-agent.yml"
      - ".github/workflows/_deploy-app-service.yml"
      - "scripts/deploy_probe.py"
  workflow_dispatch: {}

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-app-service.yml
    with:
      module: agent
      app_name: app-tradingcenter-agent
      # This is where the second question was learned. On 16 August 2026 the control plane
      # read `Running` for the better part of an hour while this container exited with code
      # 3 on every restart, and the deploy that reported green over it is why every workflow
      # here now asks whether the *process* came up.
      #
      # `/health` answers that completely. It is excluded from Easy Auth
      # (infra/app-service.tf) so a caller with no token reaches the container rather than
      # the platform's 401 — and because the module's lifespan does not finish until its
      # migrations do (`agent/migrate.py`, under the advisory lock), a process answering
      # here at all is a process whose database is at the revision this image was built for.
      # There is nothing further to ask.
      probe_path: /health
      expected_status: 200
      body_contains: '"status"'
      # Five minutes rather than three, and that is the migration: the lifespan blocks
      # until `alembic upgrade head` returns, so this module can legitimately be slower to
      # answer than one with no schema of its own.
      attempts: 20
