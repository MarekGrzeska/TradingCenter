name: deploy-agent

# Only a push to `main` deploys — the pull_request federated credential (github-oidc.tf)
# cannot even authenticate to Azure, so this cannot run from a fork's PR by construction.
on:
  push:
    branches: [main]
    paths:
      - "modules/agent/**"
      - ".github/workflows/deploy-agent.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # azure/login's OIDC exchange
  packages: write # docker push to GHCR

concurrency:
  group: deploy-agent
  cancel-in-progress: false # never cancel a deploy mid-flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Lowercased for the same reason as the other two deploy workflows — a Docker
      # reference cannot carry the capitals in `github.repository`.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/agent" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same reasoning as the other two: buildx starts cold every run otherwise.
      - uses: docker/setup-buildx-action@v3

      # Tagged with the commit, never `latest` — same reasoning as the other two deploys.
      - uses: docker/build-push-action@v6
        with:
          # The repository root, not the module: `tc-runtime` is a path dependency and
          # uv resolves it while installing the lock, so it has to be inside the context
          # (packages-replace-the-hand-copies). `.dockerignore` at the root keeps that
          # from meaning "upload every virtualenv in the tree".
          context: .
          file: modules/agent/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: app-tradingcenter-agent
          images: ${{ steps.image.outputs.name }}:${{ github.sha }}

      # Two questions, and the second is the one that used to go unasked.
      #
      # The control plane says which image App Service will serve. It does not say
      # whether the process inside it came up: `state` is the state of the *site*, and
      # on 16 August it read `Running` for the better part of an hour while the
      # container exited with code 3 on every restart. A deploy that reports green over
      # a dark module is worse than one that reports nothing.
      #
      # `/health` answers that second question, and answers it completely. It is
      # excluded from Easy Auth (infra/app-service.tf) so a caller without a token
      # reaches the container rather than the platform's 401 — and because the module's
      # lifespan does not finish until its migrations do (`agent/migrate.py`), a process
      # answering here at all is a process whose database is at the revision this image
      # was built for. There is nothing further to ask.
      - name: Confirm this commit's image is the one serving
        run: |
          set -euo pipefail
          expected="${{ steps.image.outputs.name }}:${{ github.sha }}"
          url="https://app-tradingcenter-agent.azurewebsites.net/health"
          for attempt in $(seq 1 20); do
            image=$(az webapp config container show --name app-tradingcenter-agent \
              --resource-group rg-tradingcenter \
              --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" -o tsv)
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo "000")
            echo "attempt $attempt: image=${image:-none} health=$code"
            if [ "${image#DOCKER|}" = "$expected" ] && [ "$code" = "200" ]; then
              echo "serving: $expected"
              exit 0
            fi
            sleep 15
          done
          echo "::error::app-tradingcenter-agent is not serving $expected — image=${image:-none} health=$code"
          exit 1
