name: deploy-agent

# Only a push to `main` deploys — the pull_request federated credential (github-oidc.tf)
# cannot even authenticate to Azure, so this cannot run from a fork's PR by construction.
on:
  push:
    branches: [main]
    paths:
      - "modules/agent/**"
      - ".github/workflows/deploy-agent.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # azure/login's OIDC exchange
  packages: write # docker push to GHCR

concurrency:
  group: deploy-agent
  cancel-in-progress: false # never cancel a deploy mid-flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Lowercased for the same reason as the other two deploy workflows — a Docker
      # reference cannot carry the capitals in `github.repository`.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/agent" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same reasoning as the other two: buildx starts cold every run otherwise.
      - uses: docker/setup-buildx-action@v3

      # Tagged with the commit, never `latest` — same reasoning as the other two deploys.
      - uses: docker/build-push-action@v6
        with:
          context: modules/agent
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: app-tradingcenter-agent
          images: ${{ steps.image.outputs.name }}:${{ github.sha }}

      # Same shape as deploy-gateway.yml's own check, for the same reason: unlike
      # market-data, this app has no path excluded from Easy Auth
      # (infra/app-service.tf — the agent has no WebSocket route needing one, so none
      # was carved out) — every path answers Easy Auth's own 401 before the container
      # is reached, dead or alive, alike. The control plane answers instead, over the
      # same OIDC session the deploy used.
      #
      # What this proves: the site is running and the image App Service will serve is
      # the one this run pushed. What it does not prove: that the process inside came
      # up clean — task 12.5 (`add-agent-chat`) is what checks the SSE stream itself
      # actually works once deployed, by hand, since App Service's buffering behaviour
      # only shows up there.
      - name: Confirm the deployed image is this commit's
        run: |
          set -euo pipefail
          expected="${{ steps.image.outputs.name }}:${{ github.sha }}"
          for attempt in $(seq 1 10); do
            state=$(az webapp show --name app-tradingcenter-agent \
              --resource-group rg-tradingcenter --query state -o tsv)
            image=$(az webapp config container show --name app-tradingcenter-agent \
              --resource-group rg-tradingcenter \
              --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" -o tsv)
            echo "attempt $attempt: state=$state image=${image:-none}"
            if [ "$state" = "Running" ] && [ "${image#DOCKER|}" = "$expected" ]; then
              echo "deployed: $expected"
              exit 0
            fi
            sleep 15
          done
          echo "::error::app-tradingcenter-agent is not serving $expected — state=$state image=${image:-none}"
          exit 1
