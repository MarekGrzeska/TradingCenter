name: deploy-workbench

# After a green `checks` run of this commit, never on the push itself: since P5 (2 September 2026) a merge with
# a red test stops here instead of reaching production before CI has finished saying so. `workflow_dispatch` is
# the operator's door around it. The pull_request federated credential (github-oidc.tf) cannot authenticate to
# Azure, so this cannot run from a fork's PR by construction.
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# Declared on the caller, and nowhere else will do: a reusable workflow can only *narrow* the caller's token,
# and `id-token` is never granted by default — without this every deploy fails at `azure/login`.
permissions:
  contents: read
  actions: read # deploy_gate.py lists the checks runs
  id-token: write # azure/login's OIDC exchange
  packages: write # docker push to GHCR

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/_deploy-app-service.yml
    with:
      module: workbench
      # What this image bakes in, as git pathspecs: the gate diffs them since the last green checks run.
      # Path dependencies are baked into this image, so a merged package fix that never redeploys its
      # consumers never reaches production. Three since the team tools moved in with the schema slimmer.
      paths: |
        modules/workbench
        packages/tc-runtime
        packages/tc-openai
        packages/tc-mcp-kit
        .github/workflows/deploy-workbench.yml
        .github/workflows/_deploy-app-service.yml
        scripts/deploy_probe.py
      # **The app is still called `app-tradingcenter-agent`, and that is a decision.** A name here is an identity:
      # the managed identity takes it, it is the PostgreSQL role, and its application id sits on three allow-lists.
      app_name: app-tradingcenter-agent
      # This is where the second question was learned, on 16 August 2026. `/health` is excluded from Easy Auth, and
      # the lifespan does not finish until **both** migration chains do, so a process answering here is fully migrated.
      probe_path: /health
      expected_status: 200
      body_contains: '"status"'
      # Five minutes rather than three, and that is the migrations: the lifespan blocks until `alembic upgrade head`
      # returns twice, so this module can legitimately be slower to answer than one with no schema.
      attempts: 20
