name: deploy-market-data

# Only a push to `main` deploys — the pull_request federated credential (github-oidc.tf)
# cannot even authenticate to Azure, so this cannot run from a fork's PR by construction.
on:
  push:
    branches: [main]
    paths:
      - "modules/market-data/**"
      - ".github/workflows/deploy-market-data.yml"
      - ".github/workflows/_deploy-app-service.yml"
      - "scripts/deploy_probe.py"
  workflow_dispatch: {}

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-app-service.yml
    with:
      module: market-data
      app_name: app-tradingcenter-market-data
      # `/ws/candles` and a 404, which needs explaining. Every other path answers 401 from
      # Easy Auth *before* the request reaches the container, so a dead process and a
      # healthy one are indistinguishable there. This one path is excluded from Easy Auth
      # (infra/app-service.tf, `excluded_paths`) because a browser cannot put a header on a
      # WebSocket handshake — so a plain unauthenticated GET travels all the way to the app,
      # where the router has no GET handler for a WebSocket route and FastAPI answers 404
      # with a JSON body. That JSON is the signal: it can only have come from the running
      # module. A stopped container gives App Service's own 5xx HTML instead.
      #
      # Sending no ticket is deliberate: the point is to reach the app, not to open a
      # stream.
      #
      # This probe also carries the schema, which is not obvious from the path it calls.
      # The module compares the database's revision with the one its image ships and
      # refuses to start when they differ (`market_data/schema.py`), so a deploy landing on
      # an unmigrated database has no container to answer this GET and the probe runs out.
      #
      # This module was the most exposed of the four the image assertion was added to on
      # 18 August 2026, since its own signal is a 404 the previous container returns
      # identically.
      probe_path: /ws/candles
      expected_status: 404
      body_contains: '"detail"'
      attempts: 12
