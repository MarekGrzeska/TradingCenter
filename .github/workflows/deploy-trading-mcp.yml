name: deploy-trading-mcp

# After a green `checks` run of this commit, never on the push itself: since P5 (2 September 2026) a merge with
# a red test stops here instead of reaching production before CI has finished saying so. `workflow_dispatch` is
# the operator's door around it. The pull_request federated credential (github-oidc.tf) cannot authenticate to
# Azure, so this cannot run from a fork's PR by construction.
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# Declared on the caller, and nowhere else will do: a reusable workflow can only *narrow* the caller's token,
# and `id-token` is never granted by default — without this every deploy fails at `azure/login`.
permissions:
  contents: read
  actions: read # deploy_gate.py lists the checks runs
  id-token: write # azure/login's OIDC exchange
  packages: write # docker push to GHCR

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/_deploy-app-service.yml
    with:
      module: trading-mcp
      # What this image bakes in, as git pathspecs: the gate diffs them since the last green checks run.
      # Path dependencies are baked into this image, so a merged package fix that never redeploys its
      # consumers never reaches production. Exactly the packages this module's pyproject.toml names.
      paths: |
        modules/trading-mcp
        packages/tc-mcp-kit
        .github/workflows/deploy-trading-mcp.yml
        .github/workflows/_deploy-app-service.yml
        scripts/deploy_probe.py
      app_name: app-tradingcenter-trading-mcp
      # `/health` is excluded from Easy Auth and answers plain JSON. It proves more than liveness here:
      # `__main__.py` refuses to open a port until the gateway says `demo`, so a process answering has already
      # reached the gateway with the shared key and been told it is a demo session.
      probe_path: /health
      expected_status: 200
      body_contains: '"status"'
      attempts: 12
      failure_hint: >-
        Its own start-up refuses a non-demo gateway, an unreachable one, and a rejected
        key — the container log says which.
