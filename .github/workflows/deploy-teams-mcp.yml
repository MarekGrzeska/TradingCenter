name: deploy-teams-mcp

# Only a push to `main` deploys — the pull_request federated credential (github-oidc.tf)
# cannot even authenticate to Azure, so this cannot run from a fork's PR by construction.
on:
  push:
    branches: [main]
    paths:
      - "modules/teams-mcp/**"
      # Path dependencies are baked into this image (see the Dockerfile), so a merged
      # package fix that never redeploys its consumers is a fix that never reaches
      # production. Exactly the packages this module's pyproject.toml names.
      - "packages/tc-mcp-kit/**"
      - ".github/workflows/deploy-teams-mcp.yml"
      - ".github/workflows/_deploy-app-service.yml"
      - "scripts/deploy_probe.py"
  workflow_dispatch: {}

# Declared on the caller, and this is where it has to be: a reusable workflow can only
# *narrow* the caller's GITHUB_TOKEN, never widen it. This repository's default workflow
# permission is `read`, and `id-token` is never granted by default at all — so a caller
# without this block hands the shared workflow a token that cannot push to GHCR and cannot
# exchange an OIDC assertion, and every deploy fails at `azure/login`.
permissions:
  contents: read
  id-token: write # azure/login's OIDC exchange
  packages: write # docker push to GHCR

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-app-service.yml
    with:
      module: teams-mcp
      app_name: app-tradingcenter-teams-mcp
      # `/health` is excluded from Easy Auth (infra/app-service.tf, `excluded_paths`) and
      # answers a plain 200 with a JSON body (specs/teams-mcp-transport, "Zdrowie modułu da
      # się sprawdzić bez sesji MCP").
      #
      # This probe proves less than trading-mcp's, and the difference is worth knowing
      # rather than copying over. That module refuses to open a port until the gateway
      # confirms a demo account, so its 200 carries a whole chain with it. This one has
      # nothing about `teams` worth refusing to start over — an unreachable teams is a tool
      # call that says so, not a process that will not run — so a 200 here means the
      # container came up and is serving, and nothing more. Whether it can reach teams, and
      # whether the operator's token survives the trip, is the first tool call, not this
      # check.
      probe_path: /health
      expected_status: 200
      body_contains: '"status"'
      attempts: 12
      failure_hint: >-
        Its start-up reaches nothing but its own settings, so a failure here is the settings
        or the image — the container log says which.
