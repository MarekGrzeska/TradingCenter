name: terraform

# A diff before it is applied: plan on every PR that touches infra/. There is deliberately no `apply` job — this
# root manages Entra applications, and letting CI apply it would hand the CI principal directory write. The
# concrete failure: a plan from CI once proposed destroying the operator's own Key Vault access policy.
on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  id-token: write # azurerm/azuread providers' own OIDC exchange — no azure/login needed
  pull-requests: write # posts the plan as a PR comment

concurrency:
  # One run at a time: two plans against the same state just race the lock (bootstrap/,
  # group 3), and the operator's own local apply takes that same lock.
  group: terraform
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  # `infra/terraform.tfvars` is gitignored on purpose — per-operator, not per-project. CI is not a person and needs
  # the same five values; none is a secret, being an IP, three Entra ids and a notification address.
  TF_VAR_developer_ip_address: ${{ vars.TF_VAR_DEVELOPER_IP_ADDRESS }}
  TF_VAR_operator_email: ${{ vars.TF_VAR_OPERATOR_EMAIL }}
  TF_VAR_operator_object_id: ${{ vars.TF_VAR_OPERATOR_OBJECT_ID }}
  TF_VAR_postgres_admin_object_id: ${{ vars.TF_VAR_POSTGRES_ADMIN_OBJECT_ID }}
  TF_VAR_postgres_admin_upn: ${{ vars.TF_VAR_POSTGRES_ADMIN_UPN }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - run: terraform fmt -check
      - run: terraform init
      # Written to a file rather than a step output: outputs travel through the environment, and a 45-destroy plan
      # made the runner fail with `Argument list too long` and no word about Terraform. `set -o pipefail` and `2>&1`
      # are both load-bearing — without them a plan that exited 1 was reported as a pass, with its stderr dropped.
      - run: |
          set -o pipefail
          terraform plan -no-color -input=false 2>&1 | tee "$RUNNER_TEMP/plan.txt"
        id: plan
        continue-on-error: true
      - uses: actions/github-script@v7
        # `always()` so a plan that genuinely failed still gets its output commented; the
        # step below is what turns that into a red job.
        if: always()
        with:
          script: |
            const fs = require("fs");
            const path = `${process.env.RUNNER_TEMP}/plan.txt`;
            // The plan may not exist at all — `terraform init` can fail before it runs.
            const plan = fs.existsSync(path) ? fs.readFileSync(path, "utf8") : "(no plan was produced)";

            // GitHub refuses a comment body over 65536 characters. Keep the head and the
            // tail: the tail is where `Plan: N to add, N to change, N to destroy` and the
            // output diff live, which is the half somebody reads first.
            const LIMIT = 60000;
            const elided = [
              "",
              "... [" + (plan.length - LIMIT) + " characters elided — read the job log for the whole plan]",
              "",
            ].join("\n");
            const body = plan.length <= LIMIT
              ? plan
              : plan.slice(0, LIMIT - 6000) + elided + plan.slice(-6000);

            // Read from a file rather than interpolated from an expression: plan output is
            // untrusted (it can carry resource values), and a backtick or `${` in it would
            // otherwise break out of the template literal or run as script, in a job
            // holding pull-requests: write and id-token: write.
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ["#### Terraform Plan", "```", body, "```"].join("\n"),
            });
      - if: steps.plan.outcome == 'failure'
        run: exit 1
