name: terraform

# design.md, "Wdrożenia przez OIDC": a diff before it's applied, not after — plan on
# every PR that touches infra/, apply only once that diff has landed on `main`.
on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  id-token: write # azurerm/azuread providers' own OIDC exchange — no azure/login needed
  pull-requests: write # posts the plan as a PR comment

concurrency:
  # One run at a time full stop, plan or apply: two plans against the same state just
  # race the lock (bootstrap/, group 3); a plan racing an apply would plan against
  # state an apply is about to move out from under it.
  group: terraform
  cancel-in-progress: false

env:
  # The `pull_request` federated credential (github-oidc.tf) refuses `apply`'s token
  # outright for anything but `main` — this is a second, redundant gate, not the only
  # one.
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  # `infra/terraform.tfvars` is gitignored on purpose (variables.tf: per-operator, not
  # per-project — the next person running this root has their own IP and identity). CI
  # is not a person; it needs the same three values the operator's own tfvars carries,
  # so they are mirrored here as repository vars. None of the three is a secret — an IP
  # address and two Entra object ids/UPNs are not credentials.
  TF_VAR_developer_ip_address: ${{ vars.TF_VAR_DEVELOPER_IP_ADDRESS }}
  TF_VAR_postgres_admin_object_id: ${{ vars.TF_VAR_POSTGRES_ADMIN_OBJECT_ID }}
  TF_VAR_postgres_admin_upn: ${{ vars.TF_VAR_POSTGRES_ADMIN_UPN }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - run: terraform fmt -check
      - run: terraform init
      - run: terraform plan -no-color -input=false
        id: plan
        continue-on-error: true
      - uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });
      - if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - run: terraform init
      - run: terraform apply -auto-approve -input=false
