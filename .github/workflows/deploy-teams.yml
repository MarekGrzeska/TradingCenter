name: deploy-teams

# Only a push to `main` deploys — the pull_request federated credential (github-oidc.tf)
# cannot even authenticate to Azure, so this cannot run from a fork's PR by construction.
on:
  push:
    branches: [main]
    paths:
      - "modules/teams/**"
      - ".github/workflows/deploy-teams.yml"
      - ".github/workflows/_deploy-app-service.yml"
      - "scripts/deploy_probe.py"
  workflow_dispatch: {}

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-app-service.yml
    with:
      module: teams
      app_name: app-tradingcenter-teams
      # Same shape as agent's, and learned there: `/health` is excluded from Easy Auth
      # (infra/app-service.tf), so a caller with no token reaches the container rather than
      # the platform's 401 — and because this module's lifespan does not finish until its
      # migrations do (`teams/migrate.py`, under the advisory lock), a process answering
      # here is a process whose database is at the revision this image was built for.
      probe_path: /health
      expected_status: 200
      body_contains: '"status"'
      # Five minutes, for agent's reason: the lifespan blocks on the migration.
      attempts: 20
